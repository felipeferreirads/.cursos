- id: '02'
  slug: diamantes
  title: Diamantes
  area: II. Diamantes
  prerequisites:
  - '01'
  status: completed
  learning_objectives:
  - id: gemologia-m02-oa01
    statement: Explicar como a estrutura cristalina do diamante produz suas propriedades gemológicas e distinguir
      diamante de grafite pelo arranjo do carbono
  - id: gemologia-m02-oa02
    statement: Descrever as condições e os ambientes de formação do diamante e o papel do kimberlito e do lamproíto
      no seu transporte até a superfície
  - id: gemologia-m02-oa03
    statement: Interpretar inclusões de diamantes de manto profundo e superprofundo como registro direto do interior
      da Terra
  - id: gemologia-m02-oa04
    statement: Classificar um diamante nos tipos Ia, Ib, IIa e IIb e explicar por que o tipo é base de triagem e
      não identificação
  - id: gemologia-m02-oa05
    statement: Graduar a cor de um diamante na escala D-Z e descrever as condições de observação que tornam a graduação
      reprodutível
  - id: gemologia-m02-oa06
    statement: Graduar a pureza de um diamante e nomear as inclusões e imperfeições externas registradas em um clarity
      plot
  - id: gemologia-m02-oa07
    statement: Interpretar o grau de lapidação GIA do brilhante redondo a partir dos seus componentes e das proporções
      que os controlam
  - id: gemologia-m02-oa08
    statement: Relacionar peso, tamanhos mágicos e rendimento de lapidação ao preço do diamante
  - id: gemologia-m02-oa09
    statement: Descrever a escala de cor fancy do GIA e explicar por que a lógica de valor se inverte em relação
      à escala D-Z
  - id: gemologia-m02-oa10
    statement: Avaliar o efeito da fluorescência sobre a aparência e sobre o preço de um diamante, separando evidência
      de crença de mercado
  - id: gemologia-m02-oa11
    statement: Separar o diamante dos seus principais simulantes por observação e propriedades, sem depender do
      testador de condutividade
  - id: gemologia-m02-oa12
    statement: Descrever o crescimento HPHT e reconhecer a morfologia, as inclusões e a luminescência que essa rota
      deixa como assinatura
  - id: gemologia-m02-oa13
    statement: Descrever o crescimento CVD e reconhecer a morfologia, as inclusões e a luminescência que essa rota
      deixa como assinatura
  - id: gemologia-m02-oa14
    statement: Interpretar imagens de DiamondView e espectros de fotoluminescência e situar os equipamentos de triagem
      no fluxo de um laboratório
  - id: gemologia-m02-oa15
    statement: Reconhecer os tratamentos aplicados a diamante e ler o que um laudo declara e o que ele deliberadamente
      não declara
  - id: gemologia-m02-oa16
    statement: Descrever as etapas de fabricação de um diamante lapidado, do planejamento do bruto ao polimento
      final, e explicar como a decisão de rendimento se relaciona ao grau de lapidação e à curva de preço
  objective_id_note: 'oa16 e ID NOVO, emitido em 2026-08-28 para a aula de lapidacao como processo (aula 16, inserida
