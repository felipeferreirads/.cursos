modules:
- id: '01'
  slug: gemologia-geral
  title: Gemologia geral e identificação
  area: I. Fundamentos e identificação
  prerequisites: []
  status: completed
  learning_objectives:
  - id: gemologia-m01-oa01
    statement: Definir o que caracteriza uma gema e distinguir espécie, variedade e nome comercial
  - id: gemologia-m01-oa02
    statement: Explicar a origem da cor nas gemas
  - id: gemologia-m01-oa03
    statement: Relacionar as propriedades ópticas e físicas diagnósticas à identificação
  - id: gemologia-m01-oa04
    statement: Operar refratômetro e polariscópio
  - id: gemologia-m01-oa05
    statement: Operar dicroscópio, espectroscópio e filtro Chelsea, e registrar o que a gema fez com a luz sem
      transformar observação em conclusão
  - id: gemologia-m01-oa06
    statement: Aplicar um fluxo de identificação gemológica
  - id: gemologia-m01-oa27
    statement: Operar a lupa 10×, o microscópio gemológico e a técnica de imersão, escolhendo a iluminação conforme
      a feição a revelar
  - id: gemologia-m01-oa11
    statement: Relacionar proveniência, laudos e fatores de valor à avaliação
  - id: gemologia-m01-oa12
    statement: Medir e interpretar a densidade relativa de uma gema, escolhendo entre pesagem hidrostática e líquidos
      pesados conforme o material
  - id: gemologia-m01-oa13
    statement: Executar e registrar um exame de fluorescência UV em onda longa e onda curta e interpretar seus limites
  - id: gemologia-m01-oa14
    statement: Explicar o princípio dos testadores de condutividade térmica e elétrica e separar os principais simulantes
      de diamante
  - id: gemologia-m01-oa15
    statement: Relacionar UV-Vis-NIR, FTIR, Raman e fotoluminescência às perguntas gemológicas que cada técnica
      é capaz de responder
  - id: gemologia-m01-oa16
    statement: Nomear as partes de uma gema lapidada e classificar o estilo de talhe e a forma de uma peça
  - id: gemologia-m01-oa17
    statement: Explicar como ângulo crítico e proporções determinam o desempenho óptico de uma gema e identificar
      defeitos de lapidação pelo efeito visual
  - id: gemologia-m01-oa18
    statement: Explicar o mecanismo do asterismo e da chatoyance e as condições de lapidação e iluminação que os
      revelam
  - id: gemologia-m01-oa19
    statement: Distinguir adularescência, labradorescência, jogo de cores, aventurescência e mudança de cor pelo
      mecanismo que os produz
  - id: gemologia-m01-oa20
    statement: Separar nefrita, jadeíta e imitações de jade e interpretar corretamente a classificação comercial
      A/B/C
  - id: gemologia-m01-oa21
    statement: Caracterizar opala, turquesa, lápis-lazúli, malaquita e materiais afins, reconhecendo tratamentos
      comuns e imitações
  - id: gemologia-m01-oa22
    statement: Avaliar a durabilidade de uma gema pelos três componentes (dureza, tenacidade e estabilidade) e recomendar
      uso e limpeza compatíveis
  - id: gemologia-m01-oa23
    statement: Identificar teores de metais preciosos e explicar como o tipo de engaste afeta o exame, os testes
      e a segurança da gema
  - id: gemologia-m01-oa24
    statement: Relacionar as principais espécies gemológicas aos ambientes geológicos que as produzem e explicar
      as condições que tornam uma gema rara
  - id: gemologia-m01-oa25
    statement: Localizar as principais províncias gemológicas brasileiras e associá-las ao contexto geológico e
      às gemas produzidas
