learning_outcomes:
- Caracterizar e identificar gemas com método defensável, do vocabulário de espécie e variedade ao conjunto completo
  de instrumentos de bancada e à camada espectroscópica de laboratório.
- Graduar diamantes pelos quatro fatores de qualidade e separar diamante natural de diamante crescido em laboratório
  pela lógica de triagem que os laboratórios usam.
- Graduar e avaliar gemas coradas no sistema do GIA, reconhecendo tratamentos, sintéticos e imitações espécie por
  espécie.
- Avaliar pérolas e gemas orgânicas, separando material natural de cultivado e reconhecendo os tratamentos e as
  restrições legais aplicáveis.
- Separar as cinco perguntas do ofício — identidade, origem de crescimento, tratamento, origem geográfica e valor
  — e declarar o grau de certeza que cada evidência sustenta.
