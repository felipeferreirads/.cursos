- id: '03'
  slug: gemas-coradas
  title: Gemas coradas
  area: III. Gemas coradas
  prerequisites:
  - '01'
  status: completed
  learning_objectives:
  - id: gemologia-m03-oa01
    statement: Descrever a cor de uma gema corada em matiz, tom e saturação e escrever a notação correspondente
  - id: gemologia-m03-oa02
    statement: Relacionar cor, pureza, lapidação, peso, tratamento e origem ao valor de uma gema corada, reconhecendo
      que o peso de cada fator muda por espécie
  - id: gemologia-m03-oa03
    statement: Classificar uma espécie nos tipos de pureza I, II e III e julgar uma pedra contra a expectativa da
      sua espécie
  - id: gemologia-m03-oa04
    statement: Caracterizar o coríndon como espécie, distinguir rubi de safira pelos critérios reais e relacionar
      as principais procedências ao que o mercado premia
  - id: gemologia-m03-oa05
    statement: Reconhecer tratamentos e rotas de síntese do coríndon e situar o que a bancada resolve e o que exige
      laboratório
  - id: gemologia-m03-oa06
    statement: Caracterizar o berilo e suas variedades, reconhecer os tratamentos típicos de cada uma e separar
      esmeralda natural de sintética pelos indícios de bancada
  - id: gemologia-m03-oa07
    statement: Caracterizar o supergrupo turmalina, distinguir suas variedades gemológicas e explicar a regra de
      nomenclatura da turmalina Paraíba
  - id: gemologia-m03-oa08
    statement: Caracterizar o grupo das granadas, distinguir suas séries e variedades gemológicas e explicar por
      que a granada não tem valor único de índice de refração ou de densidade
  - id: gemologia-m03-oa09
    statement: Identificar espinélio e crisoberilo, separando-os das espécies com que são historicamente confundidos
      e reconhecendo suas rotas de síntese
  - id: gemologia-m03-oa10
    statement: Identificar topázio e peridoto pelas suas propriedades, reconhecer seus tratamentos e relacionar
      cada um ao seu risco específico de durabilidade
  - id: gemologia-m03-oa11
    statement: Identificar as variedades coradas do quartzo cristalino, reconhecer seus tratamentos e situar a dificuldade
      de separação do quartzo sintético
  - id: gemologia-m03-oa12
    statement: Identificar calcedônia, jaspe e os agregados de quartzo, nomear suas variedades e reconhecer o tingimento
      como prática dominante do grupo
  - id: gemologia-m03-oa13
    statement: Identificar zircão e tanzanita e relacionar cada um ao seu risco específico de nomenclatura, tratamento
      ou durabilidade
  - id: gemologia-m03-oa17
    statement: Identificar espodumênio e iolita e relacionar cada um ao seu risco específico de durabilidade, estabilidade
      de cor ou confusão com outra espécie
  - id: gemologia-m03-oa14
    statement: Mapear os tratamentos de gemas coradas por mecanismo, estabilidade e detectabilidade, e aplicar a
      regra de divulgação com a formulação correta
  - id: gemologia-m03-oa15
    statement: Descrever as rotas de síntese de gemas coradas, reconhecer as assinaturas que cada uma deixa e aplicar
      a terminologia correta
  - id: gemologia-m03-oa16
    statement: Reconhecer vidros, plásticos e pedras montadas, aplicar o exame que os expõe e nomeá-los corretamente
  - id: gemologia-m03-oa18
    statement: Reconhecer as gemas coradas de colecionador do primeiro grupo (esfeno, feldspatos-gema, danburita,
      apatita e fluorita), identificá-las pelas propriedades diagnósticas e explicar o critério de gema que cada
      uma falha
  - id: gemologia-m03-oa19
    statement: Reconhecer as gemas coradas de colecionador do segundo grupo (cianita, diopsídio, escapolita, brazilianita
      e as demais menos frequentes), identificá-las pelas propriedades diagnósticas e explicar por que a classe
      fica fora do comércio de vitrine
  - id: gemologia-m03-oa20
    statement: Localizar as grandes províncias gemológicas asiáticas, associar cada uma às espécies que produz e
      ao contexto geológico correspondente, e explicar por que a procedência move o preço
  - id: gemologia-m03-oa21
    statement: Localizar as grandes províncias gemológicas da África, das Américas e da Oceania, e explicar o que
      sustenta, e o que limita, uma determinação de origem
  objective_id_note: 'A lista de objetivos esta na ordem das AULAS, nao na ordem numerica dos IDs. Na divisao da
    aula 13, em 2026-08-27, o objetivo de espodumenio e iolita recebeu o proximo ID livre (oa17) em vez de deslocar
