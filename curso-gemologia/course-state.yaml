decisions:
- date: '2026-08-28'
  decision: 'Na aula 16 do modulo 02, resolver as tres contradicoes internas SEMPRE em favor do material ja auditado,
    alterando apenas a aula nova. O rendimento passou de 40-55% para os 40-50% da aula 08; a afirmacao de "projeto
    optico fechado desde 1919" cedeu a tabela de combinacoes da aula 07; a exclusividade "so o diamante corta o
    diamante" cedeu a serra a laser descrita na propria aula 16.'
  rationale: 'A alternativa - mudar a aula 08 e o flashcard m02-fb096 para acomodar a aula nova - propagaria uma
    afirmacao NAO verificada (o 40-55%) sobre material que ja passou por auditoria com fonte, e obrigaria a reimportar
    cards no Anki. O sentido da correcao importa: aula nova se alinha ao corpo auditado, nunca o contrario. Resultado:
    zero arquivos antigos tocados e zero migracao de Anki.'
- date: '2026-08-28'
  decision: 'Registrar a auditoria da aula 16 como RODADA 2 dentro dos artefatos existentes do modulo
    (02-diamantes-auditoria.md/.json e 02-diamantes-revisao-didatica.md), em vez de criar arquivos por aula
    (02-diamantes-aula-16-*-auditoria.md/.json).'
  rationale: 'O modulo 02 - como os modulos 01, 03 e 04 - usa UM relatorio consolidado por modulo, e o validador
    estrutural e o publicador-notion esperam esse layout (auditoria como subpagina no topo do modulo). Criar um par
    de arquivos por aula introduziria um segundo padrao dentro do mesmo curso e deixaria os manifestos .json
    fragmentados, quebrando a propagacao por claim_id. Custo aceito: os relatorios crescem e passam a ter secoes
    datadas por rodada.'
- date: '2026-08-28'
  decision: 'Nao gerar questionario nem flashcards da aula 16 nesta passagem, mantendo gemologia-m02-oa16 em
    uncovered_objectives e a aula em flashcards.uncovered_lessons.'
  rationale: 'Pedido explicito do usuario para esta passagem. Alem disso, o encaminhamento RD-M02-ENC-05 esta aberto:
    a secao 7 (geografia da lapidacao) nao e coberta por nenhuma clausula do oa16, e escrever a questao antes de
    decidir se o objetivo ganha uma terceira clausula produziria ou uma questao sobre o que nao e objetivo, ou um
    quinto da aula sem avaliacao. O gate do plugin esta satisfeito - nenhum achado vermelho ou laranja em aberto -,
    entao a geracao pode ocorrer assim que essa decisao curricular for tomada.'
- date: '2026-08-25'
  decision: 'Separar o curso Geologia e Gemologia em dois cursos independentes: curso-geologia e curso-gemologia.'
  rationale: A area tematica de gemologia crescera para tres modulos e cerca de 57 aulas, com bibliografia, publico
    e sequencia proprios. Mante-la dentro do curso de geologia distorcia a numeracao (modulos 06, 30 e 31) e o dashboard.
- date: '2026-08-25'
  decision: Renumerar tudo e reprefixar todos os IDs (06 -> 01, 30 -> 02, 31 -> 03; geologia-gemologia-mNN-* ->
    gemologia-mNN-*), aceitando a perda do historico de repeticao espacada no Anki e o desalinhamento do page_map
    do Notion.
  rationale: Decisao explicita do usuario, ciente do custo. A alternativa - manter numeracao e prefixo herdados
    - deixaria o curso novo permanentemente marcado por uma estrutura que nao existe mais.
  impact: 1.459 cards ja revisados voltam a ser tratados como novos pelo Anki. As paginas do Notion serao duplicadas
    na primeira sincronizacao; a limpeza das duplicatas fica a cargo do usuario.
- date: '2026-08-25'
  decision: Nao fundir nenhuma das aulas 01-06 do modulo 01; aprofunda-las em vez disso.
  rationale: Cada uma cobre exatamente um objetivo de aprendizagem e marca um degrau conceitual distinto. O problema
