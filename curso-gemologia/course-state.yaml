  decision: 'Dividir a aula 13 do modulo 03 em duas: aula 13 (zircao e tanzanita, objetivo gemologia-m03-oa13 reformulado)
    e aula 14 (espodumenio e iolita, objetivo NOVO gemologia-m03-oa17). As antigas aulas 14, 15 e 16 passaram a
    15, 16 e 17; os objetivos oa14, oa15 e oa16 NAO mudaram de numero e apenas trocaram de aula-fonte. O modulo
    passou de 16 para 17 aulas e o curso, de 58 para 59.'
  rationale: 'Achado laranja 3 da revisao didatica do modulo 03: a aula carregava quatro especies sem parentesco
    mineralogico, com cinco tabelas de propriedades e 34 linhas de tabela - contra duas especies nas aulas vizinhas
