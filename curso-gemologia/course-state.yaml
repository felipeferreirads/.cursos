- date: '2026-08-25'
  decision: Referenciar os pre-requisitos do curso de Geologia por nome, e nunca por wikilink.
  rationale: Wikilink entre vaults/cursos diferentes quebra no Obsidian e no validador de links. O campo external_prerequisites
    do modulo 01 registra a dependencia de forma estruturada.
- date: '2026-08-26'
  decision: 'Dividir o modulo 03 (Gemas coradas, perolas e gemas organicas, 21 aulas) em dois: 03-gemas-coradas
    (aulas 01-16, material mineral) e 04-perolas (ex-aulas 17-21, renumeradas 01-05, material de origem biologica).
    O prefixo do novo modulo e ''perolas'' por pedido explicito do usuario, embora ele cubra tambem ambar, copal,
    azeviche, coral, marfim e madreperola.'
  rationale: 'O modulo tinha 21 aulas - mais que os outros dois somados por bloco tematico - e reunia dois regimes
    de exame incompativeis: no mineral o eixo e refratometro, birrefringencia e densidade; no biologico esses instrumentos
    quase nao servem e o exame passa a ser densidade, cheiro, solvente, fluorescencia e lupa. A fronteira entre
    a aula 16 e a aula 17 ja era o corte natural, e o questionario parcial 3 ja cobria exatamente as cinco aulas
    biologicas.'
  impact: Os 65 cards Basic e 16 Cloze das aulas biologicas foram reindexados de gemologia-m03-fb201-fb265 / fc059-fc074
    para gemologia-m04-fb001-fb065 / fc001-fc016, e o Anki voltara a trata-los como novos - os 258 cards que ficaram
    no modulo 03 mantiveram os IDs e o historico. Os IDs de questao gemologia-m03-q33-q44 viraram gemologia-m04-q01-q12,
    e as quatro questoes do bloco biologico do cumulativo antigo (q58-q61) viraram gemologia-m04-q13-q16. Os IDs
    m03 aposentados nao voltam a ser emitidos. Nenhum texto de aula foi reescrito.
