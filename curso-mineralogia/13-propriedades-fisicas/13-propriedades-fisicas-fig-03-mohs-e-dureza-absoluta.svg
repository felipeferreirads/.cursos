<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Arial, Helvetica, sans-serif">
<title>Escala de Mohs e dureza absoluta de Rosiwal</title>
<rect width="1000" height="460" fill="#ffffff"/>
<text x="500" y="28" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Mohs ordena; a dureza absoluta mostra o tamanho real dos degraus (eixo logarítmico)</text>
<line x1="70" y1="370.0" x2="960" y2="370.0" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="374.0" font-size="11" text-anchor="end" fill="#666">0,01</text>
<line x1="70" y1="332.5" x2="960" y2="332.5" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="336.5" font-size="11" text-anchor="end" fill="#666">0,1</text>
<line x1="70" y1="295.0" x2="960" y2="295.0" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="299.0" font-size="11" text-anchor="end" fill="#666">1</text>
<line x1="70" y1="257.5" x2="960" y2="257.5" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="261.5" font-size="11" text-anchor="end" fill="#666">10</text>
<line x1="70" y1="220.0" x2="960" y2="220.0" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="224.0" font-size="11" text-anchor="end" fill="#666">100</text>
<line x1="70" y1="182.5" x2="960" y2="182.5" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="186.5" font-size="11" text-anchor="end" fill="#666">1000</text>
<line x1="70" y1="145.0" x2="960" y2="145.0" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="149.0" font-size="11" text-anchor="end" fill="#666">10000</text>
<line x1="70" y1="107.5" x2="960" y2="107.5" stroke="#e3e3e3" stroke-width="1"/>
<text x="62" y="111.5" font-size="11" text-anchor="end" fill="#666">100000</text>
<rect x="90" y="352.1" width="80" height="17.9" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="130.0" y="346.1" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">0,03</text>
<text x="130.0" y="388" font-size="12" text-anchor="middle" fill="#222">talco</text>
<text x="130.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 1</text>
<rect x="185" y="291.4" width="80" height="78.6" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="225.0" y="285.4" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1,25</text>
<text x="225.0" y="388" font-size="12" text-anchor="middle" fill="#222">gipsita</text>
<text x="225.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 2</text>
<rect x="280" y="270.5" width="80" height="99.5" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="320.0" y="264.5" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">4,5</text>
<text x="320.0" y="388" font-size="12" text-anchor="middle" fill="#222">calcita</text>
<text x="320.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 3</text>
<rect x="375" y="268.8" width="80" height="101.2" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="415.0" y="262.8" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">5</text>
<text x="415.0" y="388" font-size="12" text-anchor="middle" fill="#222">fluorita</text>
<text x="415.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 4</text>
<rect x="470" y="236.2" width="80" height="133.8" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="510.0" y="230.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">37</text>
<text x="510.0" y="388" font-size="12" text-anchor="middle" fill="#222">ortoclásio</text>
<text x="510.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 6</text>
<rect x="565" y="220.0" width="80" height="150.0" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="605.0" y="214.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">100</text>
<text x="605.0" y="388" font-size="12" text-anchor="middle" fill="#222">quartzo</text>
<text x="605.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 7</text>
<rect x="660" y="210.9" width="80" height="159.1" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="700.0" y="204.9" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">175</text>
<text x="700.0" y="388" font-size="12" text-anchor="middle" fill="#222">topázio</text>
<text x="700.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 8</text>
<rect x="755" y="182.5" width="80" height="187.5" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="795.0" y="176.5" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1000</text>
<text x="795.0" y="388" font-size="12" text-anchor="middle" fill="#222">coríndon</text>
<text x="795.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 9</text>
<rect x="850" y="102.0" width="80" height="268.0" rx="0" fill="#9db8d9" stroke="#333" stroke-width="1"/>
<text x="890.0" y="96.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">140000</text>
<text x="890.0" y="388" font-size="12" text-anchor="middle" fill="#222">diamante</text>
<text x="890.0" y="404" font-size="12" text-anchor="middle" fill="#555">Mohs 10</text>
<text x="500" y="428" font-size="12" text-anchor="middle" fill="#555">Rosiwal, coríndon = 1000, numa compilação usual; a apatita (Mohs 5) foi omitida porque as fontes divergem no valor.</text>
<text x="500" y="446" font-size="12" text-anchor="middle" fill="#555">Outras tabelas dão quartzo 120 (e a original de Rosiwal, 175): os números são ordem de grandeza; a desigualdade dos degraus se mantém.</text>
</svg>
