<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Arial, Helvetica, sans-serif">
<title>O que a luz faz num mineral: brilho, cor e diafaneidade</title>
<rect width="1000" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<text x="500" y="28" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Luz branca num mineral: refletida, absorvida e transmitida</text>
<polygon points="380,190 720,190 720,330 380,330" fill="#e8eef7" stroke="#333" stroke-width="1.3"/>
<text x="650" y="265" font-size="16" text-anchor="middle" fill="#555">mineral</text>
<line x1="450" y1="150" x2="450" y2="230" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="598" y1="300" x2="598" y2="370" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="250" y1="70" x2="450" y2="188" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="220" y="62" font-size="14" text-anchor="end" fill="#222">luz branca</text>
<line x1="450" y1="188" x2="650" y2="70" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="662" y="66" font-size="14" text-anchor="start" fill="#222" font-weight="bold">refletida: BRILHO</text>
<line x1="450" y1="192" x2="598" y2="328" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<line x1="250" y1="232" x2="516" y2="254" stroke="#777" stroke-width="1" stroke-dasharray="3,3"/>
<text x="100" y="225" font-size="14" text-anchor="start" fill="#222" font-weight="bold">absorvida: COR</text>
<text x="100" y="245" font-size="12" text-anchor="start" fill="#555">(o que falta no feixe ao atravessar)</text>
<line x1="598" y1="332" x2="678" y2="379" stroke="#c0392b" stroke-width="2" stroke-opacity="0.7" marker-end="url(#a)"/>
<text x="692" y="380" font-size="14" text-anchor="start" fill="#222" font-weight="bold">transmitida: DIAFANEIDADE</text>
<text x="500" y="392" font-size="12" text-anchor="middle" fill="#555">Os três fenômenos ocorrem ao mesmo tempo no mesmo feixe.</text>
<text x="40" y="352" font-size="11" text-anchor="start" fill="#777">Esquema: reflexão com ângulo igual ao de incidência;</text>
<text x="40" y="366" font-size="11" text-anchor="start" fill="#777">em placa de faces paralelas, o feixe sai paralelo ao que entrou.</text>
</svg>
