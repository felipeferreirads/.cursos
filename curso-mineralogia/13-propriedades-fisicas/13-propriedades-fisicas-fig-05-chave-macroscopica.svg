<text x="500" y="520" font-size="13" text-anchor="middle" fill="#444">Folhas são compatíveis, não confirmadas: grupos (granada, feldspato, mica) e polimorfos (pirita e marcassita) param a chave.</text>
<text x="500" y="542" font-size="13" text-anchor="middle" fill="#444">Toda folha leva um grau de confiança (alta, média, baixa) e os testes pendentes.</text>
