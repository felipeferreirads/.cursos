<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Arial, Helvetica, sans-serif">
<title>Reflexão e refração na superfície ar-quartzo: lei de Snell</title>
<rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="500.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Reflexão e refração: luz do ar entrando no quartzo (n ≈ 1,544)</text>
<rect x="150" y="260" width="700" height="230" fill="#e8eef7"/>
<line x1="150.0" y1="260.0" x2="850.0" y2="260.0" stroke="#333" stroke-width="2"/>
<text x="170.0" y="250.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">ar (n ≈ 1,000)</text>
<text x="170.0" y="288.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">quartzo (n ≈ 1,544)</text>
<line x1="500.0" y1="50.0" x2="500.0" y2="475.0" stroke="#888" stroke-width="1.2" stroke-dasharray="6,5"/>
<text x="508.0" y="64.0" font-size="13" text-anchor="start" fill="#555">normal</text>
<line x1="354.5" y1="137.9" x2="500.0" y2="260.0" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="344.5" y="131.9" font-size="14" text-anchor="end" fill="#222" font-weight="bold">raio incidente</text>
<line x1="500.0" y1="260.0" x2="645.5" y2="137.9" stroke="#c0392b" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#a)"/>
<text x="655.5" y="131.9" font-size="14" text-anchor="start" fill="#222" font-weight="bold">refletido</text>
<line x1="500.0" y1="260.0" x2="594.3" y2="425.0" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="606.3" y="425.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">refratado</text>
