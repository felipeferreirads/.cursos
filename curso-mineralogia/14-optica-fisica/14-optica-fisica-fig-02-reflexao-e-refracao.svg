<text x="445.0" y="165.0" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">θ₁ = 50°</text>
<polyline fill="none" stroke="#1f5fa8" stroke-width="1.8" points="500.0,180.0 502.3,180.0 504.7,180.1 507.0,180.3 509.3,180.5 511.6,180.8 513.9,181.2 516.2,181.7 518.4,182.2 520.7,182.7 522.9,183.4 525.2,184.1 527.4,184.8 529.5,185.7 531.7,186.5 533.8,187.5 535.9,188.5 538.0,189.6 540.0,190.7 542.0,191.9 544.0,193.2 545.9,194.5 547.8,195.8 549.6,197.2 551.4,198.7 553.2,200.2 554.9,201.8 556.6,203.4 558.2,205.1 559.8,206.8 561.3,208.6"/>
<text x="545.0" y="160.0" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">50°</text>
<polyline fill="none" stroke="#1f5fa8" stroke-width="1.8" points="500.0,330.0 501.2,330.0 502.4,330.0 503.6,329.9 504.8,329.8 506.0,329.7 507.3,329.6 508.5,329.5 509.7,329.3 510.9,329.2 512.1,329.0 513.2,328.7 514.4,328.5 515.6,328.2 516.8,328.0 518.0,327.7 519.1,327.3 520.3,327.0 521.5,326.6 522.6,326.3 523.7,325.8 524.9,325.4 526.0,325.0 527.1,324.5 528.2,324.0 529.3,323.6 530.4,323.0 531.5,322.5 532.6,321.9 533.7,321.4 534.7,320.8"/>
<text x="572.0" y="355.0" font-size="15" text-anchor="start" fill="#1f5fa8" font-weight="bold">θ₂ = 29,7°</text>
<text x="500.0" y="505.0" font-size="14" text-anchor="middle" fill="#222">n₁·sen θ₁ = n₂·sen θ₂ :  1,000 × sen 50° = 1,544 × sen θ₂  →  θ₂ = 29,7°  (o raio refratado se aproxima da normal)</text>
</svg>
