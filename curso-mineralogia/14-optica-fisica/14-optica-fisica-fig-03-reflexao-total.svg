<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Arial, Helvetica, sans-serif">
<title>Reflexão total: ângulo crítico do quartzo para o ar</title>
<rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="500.0" y="28.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Ângulo crítico: luz saindo do quartzo (n ≈ 1,544) para o ar, θc = 40,4°</text>
<rect x="60" y="270" width="880" height="230" fill="#e8eef7"/>
<line x1="60.0" y1="270.0" x2="940.0" y2="270.0" stroke="#333" stroke-width="2"/>
<text x="180.0" y="262.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">ar (n ≈ 1,000)</text>
<text x="180.0" y="300.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">quartzo (n ≈ 1,544)</text>
<line x1="150.0" y1="465.0" x2="150.0" y2="110.0" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
<line x1="78.2" y1="424.1" x2="150.0" y2="270.0" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<line x1="150.0" y1="270.0" x2="260.9" y2="141.2" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<line x1="150.0" y1="270.0" x2="179.6" y2="333.4" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="150.0" y="60.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">θ = 25° (menor que θc)</text>
<text x="150.0" y="82.0" font-size="14" text-anchor="middle" fill="#222">sai para o ar a 40,7°</text>
<text x="150.0" y="102.0" font-size="13" text-anchor="middle" fill="#555">mais um refletido fraco (tracejado)</text>
<line x1="500.0" y1="465.0" x2="500.0" y2="110.0" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
<line x1="389.9" y1="399.5" x2="500.0" y2="270.0" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<line x1="500.0" y1="270.0" x2="675.0" y2="270.0" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="500.0" y="60.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">θ = θc = 40,4°</text>
<text x="500.0" y="82.0" font-size="14" text-anchor="middle" fill="#222">o raio refratado sai a 90° (rasante)</text>
<line x1="850.0" y1="465.0" x2="850.0" y2="110.0" stroke="#888" stroke-width="1" stroke-dasharray="6,5"/>
<line x1="710.7" y1="367.5" x2="850.0" y2="270.0" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<line x1="850.0" y1="270.0" x2="989.3" y2="367.5" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="850.0" y="60.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">θ = 55° (maior que θc)</text>
<text x="850.0" y="82.0" font-size="14" text-anchor="middle" fill="#222">reflexão total: nenhuma luz sai</text>
<text x="500.0" y="492.0" font-size="14" text-anchor="middle" fill="#222">sen θc = n₂ / n₁ = 1 / 1,544  →  θc ≈ 40,4°. Só existe indo de n maior para n menor.</text>
</svg>
