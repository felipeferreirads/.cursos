<text x="785.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal">cubo</text>
<text x="785.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="normal">0,732–1</text>
<text x="650.0" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="normal">abaixo de 0,155: NC 2 (linear)</text>
<text x="650.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="normal">razão = 1: NC 12 (esferas iguais em empacotamento compacto)</text>
<text x="650.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">regra empírica: em ~5000 óxidos, só ~66% dos ambientes</text>
<text x="650.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">de coordenação concordam com a previsão (George et al., 2020)</text>
