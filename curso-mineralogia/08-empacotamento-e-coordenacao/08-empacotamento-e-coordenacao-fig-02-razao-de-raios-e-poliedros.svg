<text x="190.0" y="368.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="normal">aresta (preta) = 2r(A)</text>
<text x="190.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="normal">diagonal (vermelha) = 2r(A) + 2r(C) = 2r(A)·√2</text>
<text x="190.0" y="47.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">(a) Corte do octaedro no limite</text>
<text x="190.0" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="bold">r(C)/r(A) = √2 − 1 = 0,414</text>
<text x="650.0" y="47.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">(b) Faixas de r(C)/r(A) e o poliedro previsto</text>
