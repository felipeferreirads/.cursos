<text x="500.0" y="395.0" font-size="12" text-anchor="middle" fill="#555">Na cunha, b é perpendicular à linha da discordância (a linha é o ponto marcado, visto de frente) e paralelo ao plano de deslizamento.</text>
<text x="500.0" y="413.0" font-size="11" text-anchor="middle" fill="#555">Esquema simplificado: a deformação elástica em torno do núcleo (compressão acima do plano, tração abaixo) não está desenhada em escala.</text>
