<text x="500.0" y="600.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444444">Vista ao longo das cadeias (eixo c), com b na vertical. Cada viga em I: duas cadeias de tetraedros (barras verticais) e a faixa de octaedros entre elas (esquema).</text>
<text x="500.0" y="618.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444444">Tracejado: os planos {110} de clivagem passam entre as vigas, cortando só as ligações mais fracas, com os cátions maiores (M2 no piroxênio, M4 no anfibólio).</text>
