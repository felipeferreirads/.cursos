schema_version: 1
skill_version: 0.2.0
course_id: mineralogia
title: Mineralogia — da cristalografia à gênese (base e avançado)
topic: 'mineralogia geocientífica geral: cristalografia geométrica e de difração, cristaloquímica, termodinâmica
  e diagramas de fase, crescimento cristalino e texturas, mineralogia óptica, métodos analíticos, sistemática IMA/Strunz,
  gênese e paragênese, evolução mineral e biomineralização, com aprofundamentos em espécies minerais e mineralogia
  gemológica e um gancho de catalogação de espécimes'
starting_level: 'ensino médio completo, sem geologia prévia. Curso autossuficiente: nenhum pré-requisito cruzado
  para outros cursos; a química, a óptica e o contexto geológico necessários são reconstruídos dentro do próprio
  curso (módulos 01, 03 e 14).'
target_level: avançado — nível de graduação plena em mineralogia e cristalografia, com incursões de pós-graduação
  nos módulos de aprofundamento (grupos espaciais, difração avançada, cinética, inclusões fluidas, geotermobarometria,
  mineralogia gemológica).
estimated_lessons: 262
estimated_hours: '109-131 h (núcleo: 199 aulas, 83-100 h; aprofundamento: 63 aulas, 26-32 h)'
learning_outcomes:
- Descrever a simetria, as formas e a geometria de um cristal com a notação cristalográfica formal (grupos pontuais,
  índices de Miller, projeção estereográfica, retículos de Bravais) e ler um grupo espacial.
- Explicar a estrutura e a composição de um mineral pela cristaloquímica (raios iônicos, coordenação, regras de
  Pauling, substituição e solução sólida) e calcular sua fórmula estrutural a partir de uma análise química.
- Identificar minerais por propriedades físicas, ao microscópio petrográfico (luz plana, polarizadores cruzados
  e conoscopia) e por difração de raios X, declarando o grau de confiança.
- Selecionar e interpretar os métodos analíticos adequados a um problema mineralógico (MEV, microssonda, Raman,
  FTIR, LA-ICP-MS, EBSD, inclusões fluidas).
- Ler diagramas de fase e aplicar a termodinâmica e a cinética para prever estabilidade, cristalização, exsolução
  e transformações minerais.
- Interpretar crescimento, zoneamento, sobrecrescimento, intercrescimento, dissolução, pseudomorfose e inclusões
  como registro da história de um cristal, separando observação, descrição interpretativa, interpretação genética
  e hipótese de processo.
- Descrever os principais minerais de cada classe química pela sistemática IMA/Nickel-Strunz, nomeá-los pelas regras
  da IMA e relacioná-los a seus ambientes de formação e paragêneses.
- Reconstruir a gênese e a sequência paragenética de uma assembleia mineral em ambiente magmático, pegmatítico,
  hidrotermal, metamórfico, sedimentar ou supergênico.
- Descrever e catalogar um espécime de coleção com os campos cristalográficos, texturais, de superfície, de associação
  e de propriedades, com grau de confiança explícito.
status: in_progress
created_at: '2026-09-29T00:00:00-03:00'
updated_at: '2026-09-30T12:57:51-03:00'
curriculum_basis: 'pesquisa das ementas e sumários de referência, cruzada com o escopo previsto pelo usuário: ementas
  do IGc-USP — GMG0106 Cristalografia Fundamental (45 h) e GMG0220 Mineralogia (105 h), com as optativas GMG0203
  Mineralogia Aplicada e GMG0425 Técnicas Gemológicas (pasta GradeCurricular/Geologia-USP) —; sumários de Klein
  & Dutrow, Manual of Mineral Science, 23a ed. (22 capítulos, incl. crescimento e defeitos, estabilidade e diagramas
  de fase, processos pós-cristalização, gemas e assembleias); Nesse, Introduction to Mineralogy (cristalografia,
  cristaloquímica, estrutura, crescimento mineral, óptica, DRX, análise química, sistemática por classe estrutural);
  Putnis, An Introduction to Mineral Sciences (simetria, anisotropia, difração, espectroscopia, defeitos, energética,
  soluções sólidas, exsolução, ordem, cinética, transformações); Perkins, Mineralogy (gênese por ambiente ígneo,
  sedimentar, metamórfico e de minério); Wenk & Bulakh, Minerals: Their Constitution and Origin (formação e ambientes);
  Dyar & Gunter, Mineralogy and Optical Mineralogy (MSA); Deer, Howie & Zussman (minerais formadores de rocha);
  Nesse, Introduction to Optical Mineralogy; normativo IMA-CNMNC (definição de mineral, lista de espécies, nomenclatura
  de grupos) e classificação Nickel-Strunz/Dana; Mindat e RRUFF como referência de dados.'
