      content_hash: d2d9fb0ce23504fe14475e0e711ae57323a993b9d0a09a690c0763a95946d7db
      revisions:
      - date: '2026-08-19'
        type: gap_incorporation
        source_report: _relatorio-lacunas-transcricoes.md
        summary: 'Incorporados os lagos proglaciais represados por gelo e a ruptura catastrófica desses represamentos (achado [incorporar]): nenhuma aula do módulo mencionava o fenômeno. Acrescentados dois parágrafos ao final de "## Conteúdo" com o caso do Lago Missoula — represamento por uma língua do manto de gelo da Cordilheira no vale do Clark Fork, mecânica da barragem de gelo que cede de uma vez, jökulhlaup, repetição do ciclo — e o registro deixado nos Channeled Scablands, incluindo a história de J Harlen Bretz como ilustração do critério de convergência de evidências, que é o tema da própria aula. Duas linhas novas no bloco de vocabulário (Lago proglacial, Jökulhlaup), um item em "Erros comuns", um em "O que não concluir" e um marcador no "Recap relâmpago". Novo objetivo local OA-03. Novas alegações auditáveis: GLA-MISSOULA-001, GLA-MISSOULA-002, GLA-SCABLAND-001, GLA-BRETZ-001.'
        ressalva_cientifica: Dois ajustes em relação ao texto do relatório. (1) As feições de até ~15 m descritas como "dunas gigantes" são megaondulações de corrente (giant current ripples), construídas por água sob lâmina profunda, não dunas eólicas; a aula corrige isso explicitamente e usa a semelhança de forma como armadilha didática (GLA-SCABLAND-001). O NPS registra 15 a 50 pés de altura, o que põe ~15 m como limite superior, não típico. (2) A velocidade de 130 km/h foi convertida para ordem de grandeza ("da ordem de 100 km/h") por LC-05; a revisão do USGS reporta descargas, não velocidades. (3) O número de enchentes entra como faixa em discussão (dezenas, possivelmente mais de cem), por LC-08 — o NPS ainda usa o enquadramento antigo de "pelo menos três colapsos", enquanto a revisão do USGS fala em dezenas a mais de cem eventos.
        fontes_adicionadas:
        - USGS, The Missoula and Bonneville floods — a review of ice-age megafloods in the Columbia River basin (usgs.gov/publications/missoula-and-bonneville-floods-a-review-ice-age-megafloods-columbia-river-basin)
        - NPS, Glacial Lake Missoula National Natural Landmark — Camas Prairie Ripples (nps.gov/places/glacial-lake-missoula-national-natural-landmark-camas-prairie-ripples.htm)
