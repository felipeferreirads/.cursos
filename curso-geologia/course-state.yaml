        source_report: _relatorio-lacunas-transcricoes.md
        summary: 'Incorporado o loess como terceiro agente de transporte do sistema glacial (achado [incorporar]): a aula cobria till, moraina, glaciofluvial e errático, mas nenhuma aula do curso mencionava loess — nem aqui, nem no Módulo 11. Acrescentados dois parágrafos ao final de "## Conteúdo" cobrindo farinha de rocha (rock flour) gerada pela abrasão glacial, exposição do silte nas planícies de degelo, deflação eólica e deposição a favor do vento em mantos de dezenas de metros, mais o vínculo granulometria-fertilidade (meio-oeste e Grandes Planícies dos EUA, loess pampeano). Duas linhas novas no bloco de vocabulário (Farinha de rocha, Loess), um item em "Erros comuns" (loess não é till peneirado), um item em "O que não concluir" e um marcador no "Recap relâmpago". Novo objetivo local OA-03. Novas alegações auditáveis: GLA-LOESS-001, GLA-LOESS-002, GLA-LOESS-003.'
        ressalva_cientifica: 'O relatório listava o Planalto de Loess da China como exemplo de loess de origem glacial. A aula incorpora o exemplo, mas com a proveniência correta: a fonte dominante daquele manto são os desertos e planícies áridas do interior da Ásia, não moagem glacial. Daí o item novo em "O que não concluir" — loess indica vento e silte disponível, não geleira. GLA-LOESS-003 registra essa ressalva.'
        fontes_adicionadas:
        - USGS, Eolian sediments (usgs.gov/publications/eolian-sediments-0)
        - USDA/NRCS, Antigo Silt Loam — Wisconsin State Soil (nrcs.usda.gov/resources/wi-antigo-silt-loam)
        - Ritter, D. F.; Kochel, R. C.; Miller, J. R., Process Geomorphology
        links_novos:
        - 11-intemperismo-solos-geomorfologia-modulo
        - 11-intemperismo-solos-geomorfologia-aula-06-relevos-eolicos-e-deserticos
