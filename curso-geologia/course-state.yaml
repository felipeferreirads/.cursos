next_action: 'PLANEJAMENTO DE 2026-08-28: três lacunas contra a grade obrigatória da USP foram fechadas em nível de PLANO, todas pendentes de conteúdo. (a) M20 expandido de 6 para 10 aulas com topografia instrumental (aulas 07–10, PTR0201) — o módulo voltou a ''in_progress'' e seu questionário e seu baralho terão de ser ESTENDIDOS depois que essas aulas existirem e forem auditadas; (b) módulo 29 — Recursos energéticos, novo, 4 aulas (GAA0301); (c) módulo 30 — Métodos numéricos para geociências, novo, 5 aulas (MAP0125), na trilha de apoio. Nenhuma aula, questionário ou flashcard foi gerado nesta sessão — o mapa curricular vai a aprovação antes de qualquer geração. Próximo passo, quando o usuário aprovar: gerar o módulo 30 primeiro, porque ele destrava o módulo 23 do curso avançado; depois as aulas 07–10 do M20 e o módulo 29. Pendências de decisão anotadas em _contexto.md: geoética, Geologia do Quaternário, pedologia aplicada e geoquímica orgânica.


  CONFERÊNCIA DE 2026-08-29: as quatro lacunas estão TODAS planejadas desde 2026-08-28 e nada foi recriado — o arquivo de retomada da raiz que dizia "planejamento não iniciado" estava desatualizado, escrito antes daquela sessão. Nenhum módulo, objetivo ou aula foi criado, alterado ou renumerado nesta data. O que mudou: (i) as optativas em limbo ganharam status explícito em _contexto.md — todas ADIADAS, nenhuma cortada — e três que faltavam entraram (GAA0289 Terrenos Cársticos aqui; GAA0342 Petrografia e Diagênese de Rochas Sedimentares e GMG0333 Magnetismo de Rocha no curso avançado); (ii) as obrigatórias de campo GMG0401 e GAA0304 passaram a ser nomeadas por código, status CORTADO, com M20 daqui e M41 do avançado como substitutos; (iii) o pré-requisito cruzado M30 -> módulo 23 do curso avançado passou a ser declarado também do lado do avançado, no campo cross_course_prerequisites.

  PRÓXIMO PASSO INALTERADO, quando o usuário aprovar a geração: módulo 30 primeiro (destrava o módulo 23 do curso avançado); depois as aulas 07–10 do M20 mais a EXTENSÃO do questionário e do baralho do M20, que hoje cobrem só as aulas 01–06 e os objetivos oa01–oa06; depois o módulo 29. Nada de conteúdo foi gerado e nada foi publicado no Notion.

  BUILD DE 2026-08-29: as 5 aulas do módulo 30 (geologia-m30-a01 a a05) foram escritas pelo geo-redator e marcadas completed, com file e content_hash no estado. O módulo 30 passou de "pending" para "in_progress" (aulas prontas; auditoria científica, revisão didática, questionário e flashcards ainda pendentes — essa etapa fica para o auditor-cientifico/revisor-didatico/geo-operacional). O hub 30-metodos-numericos-geociencias-modulo.md foi atualizado com o índice das 5 aulas e o registro do módulo. Os validadores validate_course.py, validate_state.py e validate_links.py foram rodados e não acusaram erros novos introduzidos por este build (ver detalhes no log da sessão). PRÓXIMO PASSO AGORA: (1) auditoria científica + revisão didática + questionário + flashcards do módulo 30, depois (2) as aulas 07–10 do M20 (mais a extensão do questionário e do baralho do M20), depois (3) o módulo 29. Nada foi publicado no Notion nesta sessão.

  BUILD DE 2026-08-29 (M20): as 4 aulas de topografia instrumental do módulo 20 (geologia-m20-a07 a a10 — teoria dos erros/NBR 13133, planimetria/azimutes/poligonais, altimetria/nivelamento/curvas de nível/áreas e volumes, SIRGAS2000/UTM/GNSS geodésico) foram escritas pelo geo-redator e marcadas completed, com file e content_hash no estado, continuando a numeração e o fio condutor das 6 aulas já existentes. O hub 20-metodos-campo-mapeamento-modulo.md foi atualizado com o índice das agora 10 aulas. O questionário final do M20 foi ESTENDIDO com as questões 16–23 (cobrindo oa07–oa10), sem alterar as 15 questões originais. O baralho de flashcards do M20 foi ESTENDIDO com fb061–fb100 (Basic) e fc031–fc050 (Cloze), sem alterar os cards originais — total do módulo passou de 90 para 150 cards. As Aulas 07–10, o questionário estendido e o baralho estendido AINDA NÃO passaram por auditoria científica nem revisão didática — o módulo 20 permanece "in_progress" no estado até essa etapa ser feita (mesmo tratamento dado ao módulo 30). Os validadores validate_course.py, validate_state.py e validate_links.py foram rodados e não acusaram erros novos introduzidos por este build. PRÓXIMO PASSO AGORA: (1) auditoria científica + revisão didática do módulo 20 (aulas 07–10, questionário e baralho estendidos), assim como pendente para o módulo 30, depois (2) o módulo 29 — Recursos energéticos (GAA0301, 4 aulas), que é o próximo item da fila registrada nas sessões anteriores. Nada foi publicado no Notion nesta sessão.

  BUILD DE 2026-08-29 (M29): as 4 aulas do módulo 29 — Recursos energéticos (geologia-m29-a01 a a04 — matriz energética global e brasileira; combustíveis fósseis como sistema energético; energia nuclear e geotérmica; renováveis, transição energética e clima) foram escritas pelo geo-redator e marcadas completed, com file e content_hash no estado, cobrindo oa01–oa04. O módulo 29 passou de "pending" para "in_progress" (aulas prontas; auditoria científica, revisão didática, questionário e flashcards ainda pendentes, mesmo tratamento dado aos módulos 20 e 30). O hub 29-recursos-energeticos-modulo.md foi atualizado com o índice das 4 aulas e o registro do módulo. Os validadores validate_course.py, validate_state.py e validate_links.py foram rodados e não acusaram erros novos introduzidos por este build. Com isso, os módulos 29, 20 (07–10) e 30 têm as aulas escritas nesta rodada de fechamento de lacunas; falta gerar auditoria científica, revisão didática, questionário e flashcards dos três antes de considerar as lacunas curriculares REALMENTE fechadas (hoje elas estão fechadas só em conteúdo, não em qualidade). PRÓXIMO PASSO AGORA: rodar auditoria científica + revisão didática + questionário + flashcards dos módulos 20 (aulas 07–10 e material estendido), 29 e 30, nessa ordem ou em paralelo. Nada foi publicado no Notion nesta sessão. Nenhum conflito de escrita concorrente foi detectado neste build: o M20 já estava presente no arquivo ao reler o course-state.yaml antes desta edição, e a edição foi aplicada apenas na seção do módulo 29 e neste campo.

  REVISÃO DIDÁTICA DE 2026-08-29 (M29 e M30): o revisor-didatico rodou em modo review-and-fix sobre os módulos 29 (4 aulas) e 30 (5 aulas), que já haviam passado na auditoria científica com gate liberado. Nenhum achado 🔴 nos dois módulos; veredito "bem ensinado com ressalvas" para ambos. M29: 4 🟠 · 6 🟡 · 1 🔵, nove corrigidos — o principal foi a violação do LC-07, que faltava nas QUATRO aulas (nenhuma tinha "Erros comuns" nem "O que não concluir"); também o exemplo trabalhado da aula 01, que montava o cenário de fator de capacidade e não fazia a conta, e "entalpia", que estruturava a aula 03 sem nunca ter sido definido. M30: 3 🟠 · 5 🟡 · 1 🔵, oito corrigidos — os principais foram os IDs de objetivo não canônicos (as cinco aulas usavam OA-0N em vez de geologia-m30-oa0N e nenhuma tinha o bloco "Ao final você vai conseguir", o que travaria a matriz de cobertura do gerador-de-questionarios) e o Passo 1 da aula 02, que rotulava "escalonar" um passo resolvido por substituição. As 9 aulas foram editadas e tiveram content_hash e palavras_corpo atualizados; os dois hubs tiveram o Registro do módulo reescrito e os callouts de status obsoletos corrigidos. Corpo real depois das correções — M29: 1.588 · 1.600 · 1.579 · 1.584; M30: 1.570 · 1.600 · 1.599 · 1.598 · 1.882. Todas dentro do teto de 1.600 do LC-02, EXCETO a aula 05 do M30.

  DUAS PENDÊNCIAS 🟠 FICARAM EM ABERTO, ambas por exigirem outra skill, e ambas com restrição nomeada para a etapa seguinte. (1) M29, oa01: o objetivo promete converter entre unidades de energia e comparar a matriz global com a brasileira, e nenhuma aula entrega fator de conversão nem composição concreta — a auditoria científica já havia encaminhado isso nomeadamente ao revisor-didatico. Corrigir exige conteúdo factual novo e datado (formato "(EPE/BEN 2025)") passando pelo auditor-cientifico, ou revisão do próprio objetivo pelo gerador-de-curso-modular. Enquanto isso, questionário e flashcards do M29 NÃO devem cobrar conversão numérica de unidades nem leitura de percentuais de matriz. (2) M30, aula 05: 1.882 palavras, 17,6% acima do teto, empacotando integração numérica e EDOs, com a integração ficando sem exemplo trabalhado próprio — a correção certa é dividir em 05a e 05b, decisão do gerador-de-curso-modular, e a aula foi deliberadamente NÃO podada porque comprimir violaria o próprio LC-02 (precedente direto: M16 aula 05, 1.850 palavras, dividida em 2026-08-18). Enquanto isso, questionário e flashcards do M30 devem tratar integração e EDOs como blocos separados dentro de oa05, com numeração que sobreviva à divisão.

  GATE DIDÁTICO: liberado com restrição nos dois módulos. PRÓXIMO PASSO: gerar questionário e flashcards do M29 e do M30 respeitando as duas restrições acima, e a mesma camada de qualidade (auditoria + revisão didática) das aulas 07–10 do M20, que continuam sem nenhuma das duas. Nada foi publicado no Notion nesta sessão. Nenhum questionário, baralho ou arquivo fora das pastas 29-recursos-energeticos/ e 30-metodos-numericos-geociencias/ foi tocado, além do próprio course-state.yaml.'
