decisions:
- date: '2026-08-23'
  decision: 'Area VIII removida deste curso. Os modulos 26 (Geologia ambiental e hidrogeologia), 28 (Geologia de engenharia), 29 (Geometalurgia) e 30 (Engenharia de petroleo) foram apagados: eram esqueletos vazios (apenas o hub -modulo.md, zero aulas, status pending) e seus objetivos de aprendizagem ja haviam sido reaproveitados e expandidos no curso avancado irmao ../curso-geologia-avancado/ (27 -> modulos 01-04 hidrogeologia, hidrogeoquimica, contaminacao e gestao de aguas subterraneas; 28 -> modulos 05-07 mecanica de rochas, geomecanica, mapeamento geotecnico e geotecnia ambiental; 29 -> modulo 08 geometalurgia; 30 -> modulos 09-11 tectonica de bacias, sismoestratigrafia e engenharia de petroleo). Manter os esqueletos aqui criaria duas fontes concorrentes para o mesmo conteudo. Executa a decisao de corte base/avancado registrada em 2026-08-18 no _contexto.md.'
- date: '2026-08-23'
  decision: 'Trilha de apoio renumerada 31-33 -> 27-29 (31 Quimica -> 27, 32 Fisica -> 28, 33 Matematica -> 29), ocupando o intervalo aberto pela remocao da area VIII, para nao deixar um buraco permanente na numeracao. Excecao deliberada a convencao de 2026-08-18 (''reorganizacao de trilha nunca altera prerequisites, id ou pasta de modulo existente''); paga com a atualizacao de todas as referencias cruzadas: pastas e nomes de arquivo, module id, learning_objectives[].id, lessons.items[].id e covers_objectives, IDs de flashcard nos CSVs, claim_ids de auditoria (GEO-M3x -> GEO-M2x), wikilinks e paginas de navegacao. Os objetivos geologia-m17-oa01 e geologia-m19-oa01, cobertos pelas aulas 03 e 06 da Fisica, NAO mudaram de ID; apenas o numero do modulo que os cobre passou de 32 para 28. O curso passa a ter 30 modulos: 00 a 29.'
- date: '2026-08-23'
  decision: 'As quatro entradas de notion_sync.pages dos modulos removidos foram excluidas do estado, mas as paginas correspondentes continuam existindo no Notion e precisam ser apagadas manualmente pelo usuario: 27-geologia-ambiental-hidrogeologia-modulo.md -> 3a7e3d39309681da8342d30c5f717c85; 28-geologia-de-engenharia-modulo.md -> 3a7e3d3930968198a072efa91937cb00; 29-geometalurgia-modulo.md -> 3a7e3d39309681499b5edfa7b8ad7739; 30-engenharia-de-petroleo-modulo.md -> 3a7e3d3930968145a1c5de130d31d576. Os modulos da trilha de apoio nunca chegaram a ser publicados no Notion (nenhum page_id registrado), portanto a renumeracao nao quebrou nenhum vinculo existente de sincronizacao.'
- date: '2026-08-25'
  decision: Separar a gemologia deste curso, renumerar os modulos 07-29 para 06-28 e reprefixar todos os IDs de geologia-gemologia-* para geologia-*.
  rationale: A area tematica de gemologia crescera para tres modulos numerados 06, 30 e 31, com 23 modulos de geologia no meio. Separar em dois cursos resolveu a numeracao, o dashboard e a bibliografia. Renumerar em sequencia continua foi decisao explicita do usuario, ciente do custo.
  impact: Todos os IDs de flashcard mudaram, entao o Anki trata os cards ja revisados como novos. As entradas de notion_sync.pages tiveram o campo file reapontado para o caminho novo, preservando o page_id - a sincronizacao continua atualizando as mesmas paginas em vez de duplicar. Numeros de modulo em entradas datadas de decisions e em notes historicas referem-se a numeracao vigente naquela data.
- date: '2026-08-28'
  decision: 'FECHAMENTO DE LACUNAS CURRICULARES contra a grade da USP (só planejamento; nenhuma aula, questionário ou flashcard gerado). A comparação do curso com as disciplinas OBRIGATÓRIAS da grade de Geologia do IGc-USP apontou quatro lacunas; três se resolvem neste curso.

    1) TOPOGRAFIA (PTR0201 — Topografia Geral). O M20 cobria bússola, GPS de navegação, seções e coluna estratigráfica, mas não topografia instrumental. O M20 foi EXPANDIDO de 6 para 10 aulas: as aulas 07–10 (pendentes) cobrem teoria dos erros e NBR 13133, planimetria e fechamento de poligonais, altimetria e curvas de nível, e sistema geodésico brasileiro / UTM / GNSS geodésico, com os objetivos novos oa07–oa10. Preferiu-se expandir em vez de criar módulo novo porque topografia É método de campo: um módulo separado ficaria tematicamente órfão e, colocado na área VII, exigiria renumerar os módulos 21–25, que já têm conteúdo em disco. CUSTO ACEITO: o M20 saiu de ''completed'' para ''in_progress''; seu questionário e seu baralho continuam válidos para as aulas 01–06, mas ficam INCOMPLETOS em relação a oa07–oa10 e terão de ser ESTENDIDOS (não regerados) depois que as aulas 07–10 forem escritas e auditadas. Reparo de metadado feito de passagem: as 6 aulas existentes do M20 não declaravam ''status'' e passaram a declarar ''completed'', o que elimina erros de schema e de contagem que o validador já acusava.

    2) RECURSOS ENERGÉTICOS (GAA0301, obrigatória). Havia petróleo (M22) e carvão/urânio como depósitos (M21), mas nenhuma visão de sistema energético. Criado o MÓDULO 29 (Recursos energéticos, área VII, 4 aulas pendentes, pré-requisitos 21 e 22), seguindo o conteúdo programático real da GAA0301: matriz energética global e brasileira, fósseis, nuclear e geotérmica, renováveis, mudança climática e CCS.

    3) MÉTODOS NUMÉRICOS (MAP0125 — Cálculo Numérico para Geociências). A trilha de apoio só tinha trigonometria, vetores, funções e estatística (M28). Criado o MÓDULO 30 (Métodos numéricos para geociências, trilha de apoio A, 5 aulas pendentes, pré-requisito 28). Optou-se por módulo novo em vez de expandir o M28 — ao contrário do que se fez com o M20 — porque MAP0125 é uma disciplina própria de 60 h com objetivo distinto do M28, e porque manter o M28 lacrado preserva intactos sua auditoria, seu questionário e seu baralho já aprovados. Este módulo é o PRÉ-REQUISITO DE FATO do módulo 23 (modelagem numérica geodinâmica) do curso avançado.

    SEM RENUMERAÇÃO: os módulos 29 e 30 foram acrescentados no fim da numeração; nenhum módulo existente mudou de id, de pasta ou de nome de arquivo. O 29 aparece dentro da área VII na listagem porque foi inserido logo após o 25 no array ''modules'' (o agrupamento por área usa a ordem do array), e o 30 fecha a trilha de apoio.

    4) A quarta lacuna (Exploração Mineral GAA0405 + Avaliação de Recursos Minerais GAA0404) foi fechada no curso irmão curso-geologia-avancado, módulo 42, por ser matéria de especialização.'
- date: '2026-08-29'
  decision: 'CONFERÊNCIA DO FECHAMENTO DE LACUNAS E STATUS EXPLÍCITO DAS PENDÊNCIAS (só planejamento; nenhuma aula, questionário ou flashcard gerado; nada publicado no Notion).

    NENHUM MÓDULO, OBJETIVO OU AULA FOI CRIADO, ALTERADO OU RENUMERADO NESTA DATA. A sessão foi reaberta acreditando que as quatro lacunas contra a grade obrigatória da USP ainda estavam por planejar: o arquivo de retomada na raiz do vault (_RETOMAR-lacunas-grade-usp.md) declarava "planejamento não iniciado". Ele foi escrito ANTES da sessão de 2026-08-28 e nunca atualizado depois dela. A conferência contra este estado mostrou que as quatro estavam plenamente planejadas — M20 com 10 aulas (07–10 pendentes, topografia instrumental) e 10 objetivos; módulo 29 (Recursos energéticos) com 4 aulas e 4 objetivos; módulo 30 (Métodos numéricos) com 5 aulas e 5 objetivos, os três hubs em disco; e o módulo 42 no curso avançado. Recriar qualquer um teria duplicado trabalho já aprovado e provavelmente introduzido divergência de ids.

    STATUS EXPLÍCITO DAS OPTATIVAS EM LIMBO (em _contexto.md). As quatro pendências anotadas em 2026-08-28 estavam sem status declarado — nem cortadas, nem adiadas, nem planejadas — e três outras não estavam anotadas em lugar nenhum: GAA0289 (Geologia dos Terrenos Cársticos) aqui, e GAA0342 (Petrografia e Diagênese de Rochas Sedimentares) e GMG0333 (Introdução ao Magnetismo de Rocha) no curso avançado. Todas passaram a ter status, com o que cada decisão precisa resolver e onde o assunto encosta hoje. TODAS FICARAM ADIADAS, NENHUMA CORTADA: cortar é decisão de escopo do usuário, não do agente. Também ficou registrado que a GAA0291 (Palinologia de Quaternário) não sustenta módulo sozinha e é candidata a aula de proxy dentro de um eventual módulo de Quaternário, e que a GAA0202 (Geoquímica Ambiental e Forense) atravessa os dois cursos — a primeira decisão sobre ela é em qual curso fica.

    OBRIGATÓRIAS DE CAMPO COM CÓDIGO NOMEADO: a linha genérica "disciplinas de campo" da tabela de lacunas conscientemente não implementadas passou a nomear GMG0401 (Mapeamento Geológico) e GAA0304 (Mapeamento Geológico de Terrenos Sedimentares), status CORTADO, com o substituto declarado — M20 daqui e M41 do curso avançado. Mesmo tratamento já dado a 0440335 (Estágio) e 0440500 (Trabalho de Formatura).

    PRÉ-REQUISITO CRUZADO M30 -> M23 DO AVANÇADO, AGORA DECLARADO DOS DOIS LADOS. Este estado e o _curso.md daqui já diziam que o módulo 30 é o pré-requisito de fato do módulo 23 do curso avançado (modelagem numérica geodinâmica); o curso avançado não dizia nada, e quem abrisse o módulo 23 de lá não teria como saber. A dependência passou a ser declarada também lá, no campo cross_course_prerequisites do módulo 23 e no hub do módulo. Campo novo em vez de prerequisites porque o grafo formal de cada curso só aceita ids do próprio curso.

    ORDEM DE PRODUÇÃO REAFIRMADA: quando o usuário aprovar a geração, o módulo 30 vem primeiro, porque destrava o módulo 23 do curso avançado; depois as aulas 07–10 do M20 (e a EXTENSÃO do questionário e do baralho do M20, que hoje cobrem só as aulas 01–06 e os objetivos oa01–oa06); depois o módulo 29.'
- date: '2026-08-29'
  decision: 'QUESTIONÁRIOS FINAIS DOS MÓDULOS 29 E 30 GERADOS (skill gerador-de-questionarios; flashcards NÃO gerados; nada publicado no Notion). Ambos os módulos têm <=5 aulas, então 1 questionário final cumulativo cada, sem parciais.

    M29 (Recursos energéticos): 13 questões (6 múltipla escolha, 3 V/F com justificativa, 2 dissertativas curtas, 3 de aplicação). Cobre os 4 objetivos: oa01 -> Q1-4, oa02 -> Q5-7, oa03 -> Q8-10, oa04 -> Q11-13. RESTRIÇÃO DIDÁTICA RESPEITADA (achado laranja 2 da revisão didática, ainda aberto): nenhum item exige conversão numérica entre tep/EJ/BTU/MWh nem leitura de percentuais de matriz concreta. oa01 é avaliado por necessidade de unidade comum, estrutura do balanço, energia primária x final, matriz elétrica x matriz total e capacidade instalada x energia gerada — esta última com um item numérico (Q3), que usa só GW x horas x fator de capacidade, sustentado pelo exemplo trabalhado corrigido da aula 01. Arquivo: 29-recursos-energeticos/29-recursos-energeticos-questionario-final.md.

    M30 (Métodos numéricos): 15 questões (7 múltipla escolha, 2 V/F com justificativa, 1 dissertativa curta, 5 de aplicação). Cobre os 5 objetivos: oa01 -> Q1-3, oa02 -> Q4-6, oa03 -> Q7-8, oa04 -> Q9-11, oa05 -> Q12-15. RESTRIÇÃO DIDÁTICA RESPEITADA (achado laranja 1 da revisão didática, ainda aberto): integração numérica e EDOs tratadas como blocos separados dentro de oa05 — Q12-Q13 avaliam oa05a (integração; Q13 é item de aplicação próprio, regra do trapézio sobre taxa de subsidência, suprindo a ausência de exemplo trabalhado na aula) e Q14-Q15 avaliam oa05b (EDOs). A numeração das questões 12-15 sobrevive à futura divisão da aula 05 em 05a/05b sem renumeração; se oa05 for desmembrado no estado, basta reapontar o rótulo de objetivo de cada bloco. Arquivo: 30-metodos-numericos-geociencias/30-metodos-numericos-geociencias-questionario-final.md.

    PENDÊNCIAS: flashcards dos dois módulos (outro agente); divisão da aula 05 do M30 em 05a/05b e desmembramento de oa05 (gerador-de-curso-modular); achado laranja de oa01 do M29 (conteúdo novo auditado ou revisão do objetivo). Publicação no Notion não feita.'
