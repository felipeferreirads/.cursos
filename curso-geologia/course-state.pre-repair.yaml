replan_reason: >-
  O currículo original partia de "alguma base" e produzia aulas de 2.000 a 6.000
  palavras que pressupunham química, física de ondas e matemática de exponenciais
  já sabidas. A repartida de 2026-08-16 criou o M00 e aulas-ponte para fechar essas
  lacunas. Em 2026-08-17, a entrada foi calibrada para ensino médio completo sem
  geologia prévia: M00 e pontes permanecem, agora como revisão/nivelamento opcional,
  sem reduzir o nível de chegada nem descartar conteúdo.
curriculum_basis: graduação em geociências + taxonomia de áreas fornecida pelo usuário + geologia regional do Brasil (CPRM/SGB) + programa Graduate Gemologist do GIA
starting_level: ensino médio completo, sem pressupor domínio prévio de geologia
target_level: avançado/especialista
estimated_lessons: 205
estimated_hours: 115–130 h

# Contrato de nível — vale para toda aula gerada ou revisada a partir de 2026-08-17.
# O gerador-de-aula e o revisor-didatico devem verificar estes itens.
level_contract:
  id: ensino-medio-sem-geologia-v1
  adopted_at: '2026-08-17'
  rules:
  - id: LC-01
    rule: >-
      Nenhum termo técnico de geociências aparece sem definição em linguagem comum
      na mesma frase ou na frase seguinte, na primeira vez que é usado na aula.
      Conhecimentos gerais do ensino médio podem ser reativados brevemente, sem
      tratá-los como domínio especializado já consolidado.
  - id: LC-02
    rule: >-
      Teto de 1.600 palavras por aula (corpo, sem contar cabeçalho, recap e bloco
      de auditoria). Assunto que não cabe vira Parte 1 / Parte 2 ou é deferido a
      um módulo posterior — nunca é comprimido.
  - id: LC-03
    rule: >-
      Toda aula abre com um bloco "Vocabulário desta aula" (5 a 8 termos, uma
      linha cada) e com "Antes de começar, você precisa saber", que lista os
      conceitos exigidos e linka as aulas que os ensinam ou revisam.
  - id: LC-04
    rule: >-
      Cada conceito central recebe pelo menos uma analogia do cotidiano antes da
      formulação técnica. A analogia vem primeiro, o termo depois.
  - id: LC-05
    rule: >-
      Números em ordem de grandeza, não em precisão de laboratório. "Cerca de
      2.900 km" e não "2.891 km". A precisão fica para o módulo que a justifica
      (tipicamente M20). Isso reduz achados de auditoria por valor desatualizado.
  - id: LC-06
    rule: >-
      Derivações matemáticas usam apenas ferramentas explicitamente reativadas.
      Aulas-ponte funcionam como revisão/nivelamento opcional: o aluno pode pulá-las
      após checagem diagnóstica, mas elas permanecem como referência consultável.
  - id: LC-07
    rule: >-
      As seções "Erros comuns", "O que não concluir" e "Recap relâmpago" são
      obrigatórias e permanecem — são o que sustenta a honestidade epistêmica do
      curso no nível iniciante.
  - id: LC-08
    rule: >-
      Controvérsia de literatura é apresentada como pergunta em aberto, em uma
      frase, sem o detalhe do debate. O detalhe fica para o módulo avançado
      indicado. O aluno iniciante precisa saber que a questão existe, não
      arbitrá-la.
  deferral_policy: >-
    Conteúdo cortado das aulas na repartida não é descartado: cada corte é
    registrado no campo deferred_content do módulo, com o módulo de destino.
  leveling_policy: >-
    O M00 e as aulas marcadas como bridge são revisão/nivelamento opcional para
    quem concluiu o ensino médio. Podem ser pulados quando o aluno demonstrar os
    objetivos correspondentes em uma checagem diagnóstica; continuam disponíveis
    como referência e não são removidos do currículo nem dos materiais derivados.

learning_outcomes:
- Partir do ensino médio completo, sem conhecimento prévio de geologia, e chegar a classificar minerais, rochas e gemas e a interpretar dados geoquímicos e isotópicos.
- Ler o tempo geológico, correlacionar estratos, interpretar o registro fóssil e mapear geologia em campo.
- Interpretar estrutura, tectônica, geofísica, vulcanismo e a evolução da Terra, incluindo a geologia do Brasil e de outros planetas.
- Aplicar geologia a recursos, petróleo, ambiente, engenharia e processamento mineral; identificar e avaliar gemas.

