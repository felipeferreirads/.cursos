  area: I. Fundamentos do ofício
  objective: Delimitar o que a lapidação é e o que ela não é, fixar o vocabulário de anatomia e de família de talhe
    que o curso inteiro usa, e converter as propriedades diagnósticas da gema — já sabidas do curso de Gemologia
    — em restrições concretas de projeto de corte.
