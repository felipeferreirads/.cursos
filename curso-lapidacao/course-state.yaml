      — o que a pedra permite, o que o talhe promete e o que a peça precisa entregar
    cognitive_level: explicar
  - id: lapidacao-m01-oa02
    statement: Nomear as partes de uma pedra lapidada e empregar corretamente a nomenclatura das facetas
    cognitive_level: lembrar
