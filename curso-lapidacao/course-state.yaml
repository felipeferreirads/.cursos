      cima nao encolhe - quem faz sair de calibre e o ponto chato do m06 a04); cinta ondulada
      classificada de dois jeitos dentro da mesma aula (secao dizia simetria, tabela dizia acabamento -
      a GIA resolve a favor de simetria); e uma referencia a "aula 05 do modulo 05" onde o conteudo esta
      na 06. Um laranja de ESCOPO merece destaque para o questionario: a aula 04 estendia ao recorte a
      regra de divulgacao do modulo 13, mas recorte NAO e tratamento e nenhum dos tres gatilhos da FTC
      (16 CFR 23.24) o alcanca - o corpo ja ressalvava, mas Recap e Erros comuns afirmavam a obrigacao
      como norma, desfazendo a fronteira que o m13 gastou uma aula construindo; reescrito separando
      PRINCIPIO de NORMA e nomeando o fundamento real (peso, medidas e laudo anteriores deixam de
      descrever a pedra entregue). O azul (Sinkankas creditado por um capitulo de recorte nao
      confirmado) foi fechado sem inventar correcao: a atribuicao foi rebaixada ao que ele sustenta e a
      substancia passou para a serie verificada do IGS sobre recorte e repolimento, mais Denver Gem
