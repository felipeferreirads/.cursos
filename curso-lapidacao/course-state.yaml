    padrao_dominante: 'RESIDUO DE REFUTACAO. A auditoria de 2026-09-04 nao corrigiu numeros soltos
      na a02 - INVERTEU A TESE (o alvo nao cai com o indice; e quase plano, por um piso que desce
      contra um teto que nao desce). Uma inversao dessas deixa rastro em toda superficie que a
      auditoria nao teve motivo FACTUAL para tocar: entrada de vocabulario, bloco "Antes de comecar",
      titulo de secao, bloco "Proxima aula" da aula ANTERIOR. CINCO dos sete achados vermelho/laranja
      sao exatamente isso - texto que estava correto na versao antiga e que na versao nova ENSINA A
      PROPOSICAO REFUTADA. O auditor nao os pega porque, isoladamente, cada um e frase de
      enquadramento sem claim_id. Registrado como regularidade a olhar em toda revisao didatica que
      siga uma auditoria com achado vermelho de TESE (e nao so de valor).'
    achado_bloqueante: 'VERMELHO 1 (a02) - A ENTRADA DE VOCABULARIO ENSINAVA EXATAMENTE A PROPOSICAO
      QUE A AULA EXISTE PARA REFUTAR. A linha "faixa de indice de refracao" dizia "um intervalo de
      indice dentro do qual varias gemas diferentes COMPARTILHAM O MESMO ANGULO-ALVO de referencia" -
      falso contra a propria tabela tres telas abaixo (faixa 1,56-1,65: berilo 43, turmalina 42,
      topazio 41) e em contradicao frontal com a entrada "angulo-alvo" DUAS LINHAS ACIMA na mesma
      tabela, que a auditoria ja corrigira para "publicado por material, nao por faixa". A gravidade
      vem de ONDE estava: a tabela de vocabulario e a primeira coisa que o leitor le e o lugar onde
      LC-01 promete que os termos serao definidos. O leitor entrava com o modelo errado instalado
      pela fonte que deveria proteje-lo dele e passava a aula encontrando evidencia contra o que a
      aula acabara de lhe dizer, sem que nada explicasse a contradicao. Reescrita para "usado para
      ORGANIZAR a leitura da tabela, agrupando gemas de indice proximo. Nao implica que elas recebam
      o mesmo angulo-alvo: dentro de uma mesma faixa os valores publicados diferem." Fora de
      palavras_corpo pela regua.'
    titulo_a02_decisao: 'AVALIADO E MANTIDO - e o segundo ponto de atencao prioritaria do encargo, e
      a decisao e NAO MEXER, com tres razoes. (1) O titulo ja contem o proprio antidoto: a segunda
      metade ("e o que ela realmente diz") enquadra a primeira como O OBJETO SOB EXAME, nao como a
      tese ensinada - e "por faixa de indice" e exatamente a expectativa ingenua que a aula existe
      para corrigir; remove-la apagaria o adversario da aula. (2) A CASCATA E MUITO MAIOR do que o
      encargo supoe e o item mais alto dela e intocavel por esta skill: "angulos-alvo por faixa de
      indice de refracao" esta verbatim em course-state learning_outcomes, em modules[08].objective,
      no hub, em lapidacao-m08-oa02 e no bloco "Ao final voce vai conseguir" da propria aula, e em
      DUAS passagens do _contexto.md (Escopo por bloco tematico e Profundidade combinada no
      facetamento). Trocar o titulo sem trocar o OBJETIVO produziria uma aula cujo titulo e cujo oa02
      discordam - MAIS incoerencia, nao menos; e trocar o objetivo e decisao de CURRICULO
      (planejador-curricular / gerador-de-curso-modular), nao de didatica nem de auditoria. (3) O
      defeito real era INTERNO e foi corrigido: o titulo da SECAO ("valores de referencia por faixa",
      sobre uma tabela por material) e a entrada de vocabulario - vermelho 1 e laranja 2, ambos
      aplicados. Com o vocabulario corrigido, o leitor recebe a chave de leitura do titulo ANTES de
      entrar no conteudo. NENHUM arquivo renomeado, NENHUM wikilink alterado, hub sem renome.
      ENCAMINHADO: se o gerador-de-curso-modular reabrir os objetivos do modulo 08 por outro motivo,
      lapidacao-m08-oa02 merece virar algo como "Ler a tabela de angulos-alvo, explicar por que os
      valores publicados sao quase planos apesar da queda do angulo critico, e declarar seus limites"
      - e SO ENTAO o titulo da aula, o nome do arquivo e os wikilinks acompanham, numa passada unica.'
    achados_por_aula:
      a01: 'LARANJA 1 - o bloco "Proxima aula" PROMETIA A VERSAO REFUTADA da a02: "a base fisica de
        por que indices mais altos toleram pavilhoes mais rasos" e literalmente a tese que o vermelho
        3 da auditoria (TAB-BASE-FISICA-001) derrubou, e a a01 a apresentava nao como intuicao a
        testar mas como O QUE A PROXIMA AULA VAI DEMONSTRAR. Custo tipico de uma auditoria que so
        toca os arquivos onde a alegacao vive: frases de encaminhamento nao tem claim_id e atravessam
        a auditoria intactas mesmo quando ficam falsas. Trocado por "a base fisica que explica por
        que esses valores sao quase planos enquanto o angulo critico despenca". AMARELO 3 - duas
        remissoes ("a faixa que a aula 02 TABELA POR INDICE DE REFRACAO", no corpo e no recap)
        trocadas por "a aula 02 preenche com os valores publicados para cada material"; e em "O que
        nao concluir", a margem que "VARIA com o indice" virou "CRESCE com o indice em vez de
        encolher", que e o que TAB-EX-MARGEM-001 calcula. Conferida e MANTIDA a variante "a margem
        que a tabela da aula 02 ja embute" - continua verdadeira.'
      a02: 'A aula mais alterada, como o encargo previa. VERMELHO 1 (vocabulario) - ver
        achado_bloqueante. LARANJA 2 (enquadramento e titulo de secao, encargo 5) em duas pecas: (a)
        "Antes de comecar" dizia que o indice de refracao e "A UNICA VARIAVEL DE ENTRADA DA TABELA",
        o que deixou de ser verdade - ele calcula a coluna do critico e organiza as linhas, mas nao
        determina o alvo; reescrito. (b) titulo "A tabela - valores de referencia POR FAIXA" sobre
        uma tabela cuja coluna de valores e por material - QUARTA ocorrencia do padrao neste curso
        (m04, m06, m07, sempre na a02), confirmando a regularidade que a revisao do m07 registrou;
        trocado para "A tabela - angulo critico calculado, pavilhao publicado por material". Removida
        de passagem uma circularidade no paragrafo de abertura da secao ("nao por faixa de indice, e
        e por isso que APARECE POR MATERIAL" -> "e por isso a tabela TEM UMA COLUNA DE MATERIAL").
        AMARELO 1 - a nota sobre berilo e zircao era ERRATA SEM LEITOR ("Duas faixas costumam ser mal
        lidas", corrigindo colocacoes que a tabela ao lado ja faz certo: existia porque a versao
        ANTERIOR errava) e estava ENTRE o conjunto da USFG e o diamante, cortando ao meio a linha
        "os valores sao planos -> o diamante e o caso extremo que mostra por que". Reenquadrada como
        regra de leitura positiva ("a faixa e indice de leitura, nao compartimento") e movida para
        logo depois da analise da coluna plana. Ordem final da secao: tabela -> a coluna e plana ->
        a faixa e indice, nao compartimento -> o diamante -> o conjunto da USFG com o "no magic
        bullet" -> e dai direto para "O que a tabela nao substitui", que desenvolve essa ressalva.
        Dados de TAB-ALVO-FAIXA-002 integros palavra por palavra. AMARELO 2 - (a) nao havia transicao
        da secao 1 para a 2, a mais densa da aula: ponte instalada ("Sobra a pergunta que a secao
        seguinte responde - o que decide onde esses valores caem"); (b) a refutacao "e nao e o que a
        literatura publica" chegava ~250 palavras ANTES de o leitor ver o que a literatura publica -
        negacao sem referente, a forma mais cara de suspense em material sem professor; referente
        imediato acrescentado ("os valores da tabela abaixo mal se movem enquanto o critico
        despenca"). EXEMPLO TRABALHADO (encargo 1) - CONFERIDO E APROVADO: o quartzo 40,5 vem
        calculado na a01 e a safira 34,4 e checavel contra a faixa 33,5-34,6 da propria tabela; o
        paragrafo pos-tabela ja entrega a resposta ("o corindon fica nos mesmos 42"), de modo que o
        exemplo funciona como VERIFICACAO RIGOROSA e nao como descoberta - o que e o uso certo depois
        de uma tese enunciada. Unica acao: "Corindon: 42" no Passo 2 virou "Safira: 42", normalizando
        o exemplo num nome so (a equivalencia ja esta no enunciado e na linha da tabela); antes o
        exemplo alternava safira/corindon/safira em quatro passos.'
      a03: 'LARANJA 4 (LC-01) - "LUMINOSIDADE" entrava como QUARTO substantivo, sem definicao, na
        aula cuja primeira secao se chama "Por que separar os tres por mecanismo, nao por definicao".
        Numa aula qualquer seria amarelo; aqui e laranja porque a aula acabara de ensinar que
        palavras parecidas nomeiam mecanismos diferentes - treinado assim, o leitor faz a coisa certa
        (assume um quarto efeito) e erra POR OBEDECER A AULA. O termo ainda reaparecia no exemplo
        trabalhado e no recap, consolidando o conceito inexistente. Aposto na primeira ocorrencia:
        "que e este mesmo BRIGHTNESS, e nao um quarto efeito". AMARELO 4 - o compromisso dos tres
        efeitos era enunciado QUATRO vezes em pouco mais de 400 palavras (fim da secao Dispersao, "Os
        tres juntos", exemplo trabalhado, recap); a segunda ocorrencia, a mais proxima da primeira e
        a menos informativa, comprimida em 15 palavras, que financiaram o laranja 4.
        BRI-PROJ-COMPR-001 integralmente preservado.'
      a04: 'AMARELO 5 - "profundidade total" definida no vocabulario e AUSENTE do corpo, que fala
        sempre em profundidade de PAVILHAO: sintoma direto do encargo 4 (o paragrafo que usava o
        termo saiu no enxugamento, a entrada ficou). Nao e conteudo perdido - nada no argumento da
        a04 precisa da altura total - mas e carga cognitiva paga por nada. Linha removida; restam 5
        entradas, dentro da faixa 5-10 de LC-03. AMARELO 6 - a oposicao corte de precisao x corte
        nativo estava ENTERRADA dentro do terceiro dos "tres lugares": a secao promete tres lugares
        em negrito e depois do paragrafo de contorno vinham mais dois paragrafos que nao sao sobre
        contorno, ancorados em "E AQUI que a literatura opoe". Quem le pela estrutura fica sem saber
        onde o terceiro lugar termina. Abertura trocada para "Os tres lugares reaparecem juntos numa
        oposicao que a literatura nomeia", que fecha a lista antes de abrir a oposicao.
        FAC-REN-CONTORNO-001 e FAC-REN-NATIVO-001 intactos. AZUL 4 - a derivacao dos 76,9% (por que a
        razao entre as areas e b/a) NAO instalada, com justificativa: oa04 e sobre ONDE o compromisso
        e decidido e nao sobre geometria de elipse, o numero esta ali como ordem de grandeza conforme
        LC-05, 1/1,3=0,769 e verificavel pelo leitor, e a a04 entrou na revisao ACIMA do teto (1605),
        de modo que as ~20 palavras teriam de sair de mecanismo auditado.'
      a05: 'LARANJA 5 (LC-03) - a aula DEPENDE da a02 e da a04 e nao declarava NENHUMA das duas: abre
        literalmente com "A aula 04 tratou a profundidade de pavilhao como uma variavel que troca
        desempenho optico por rendimento", ancora as duas prescricoes centrais no valor-alvo da a02
        (referenciado seis vezes) e fecha o exemplo com "a mesma tabela da aula 02". As duas aulas de
        que ela mais depende eram as duas que nao declarava. Para quem le em ordem o custo e baixo;
        para quem volta a a05 isolada - o modo de uso normal de um vault de Obsidian - o cabecalho
        manda estudar as aulas erradas. a02 e a04 acrescentadas a linha de pre-requisito com wikilink
        e com a razao de cada uma, mais um marcador novo em "Antes de comecar" que amarra a ancora
        que a aula usava sem nomear: e sempre EM RELACAO AO VALOR-ALVO que ela diz "mais raso" ou
        "mais fundo". AMARELO 7 (parte) - "a leitura de material DA SECAO ANTERIOR", lido de dentro
        de "O que nao concluir", tanto podia ser o exemplo trabalhado quanto "Erros comuns"; trocado
        por "a leitura de saturacao do bruto (modulo 05)". Removida tambem a faixa "1,74-1,81" do
        enunciado do exemplo trabalhado: nao casava com a linha da granada piropo na tabela da a02
        (1,66-1,75) - reconciliavel por especie, mas o leitor que cruza as duas nao tem como saber
        disso - e nao fazia trabalho nenhum, ja que o ponto do exemplo e que o valor-alvo e o MESMO
        para as duas granadas; substituida por exatamente essa afirmacao, que e mais forte. ANALOGIA
        DO VINHO estendida ate onde ela quebra ("e que, alem de certa espessura, faz a garrafa
        parecer preta em vez de vermelha"), pre-carregando o teto de saturacao perceptual que a secao
        seguinte usa - a mesma conclusao qualitativa de COR-PROF-ESCURO-001, nao fato novo.'
      a06: 'LARANJA 3 (LC-01, homonimo) - "INDICE" muda de significado sem aviso depois de CINCO
        aulas: "o GemCad, que especifica cada faceta (indice, angulo, altura)" usa indice no sentido
        de posicao no disco dentado (index gear, assunto do modulo 09) num modulo em que "indice"
        significou indice de refracao no titulo da a02, no objetivo oa02 e na coluna da esquerda da
        tabela. O leitor conclui que cada faceta tem um indice de refracao proprio - absurdo, e
        plausivel o bastante para nao disparar alarme, ja que a aula acabara de falar em tracar raios
        por refracao; e o erro e estrutural, porque e a definicao do que o GemCad E. Aposto que
        define e contrasta na primeira ocorrencia ("a posicao no disco dentado da maquina, nao o
        indice de refracao"); vocabulario e recap alinhados a "posicao de indice". Correcao minima
        deliberada - o sistema de indice e lapidacao-m09-a01, ensina-lo aqui inflaria a aula que
        fecha o modulo. AMARELO 7 (encargo 3, LACUNA DE COR) - A REFORMULACAO ESTA CLARA E A DIVISAO
        DE TRABALHO ENTRE a05 E a06 E CORRETA: a a05 mantem o corpo inteiro sobre cor e profundidade
        e so sinaliza a limitacao em "O que nao concluir"; a a06 e quem a desenvolve, nomeando a
        suposicao comum, matando-a com as capacidades documentadas do GemRay e so entao listando as
        tres lacunas reais. NENHUMA redundancia de conteudo entre as duas (a a05 diz que a ferramenta
        nao substitui a leitura do bruto, a a06 diz por que). O que sobrava era de TOM: o leitor era
        posicionado como portador da crenca errada em quatro lugares, e na terceira acusacao ele
        nunca tivera chance de te-la, porque a a05 o vacinara antes. Removido "Ao contrario do que se
        supoe," do exemplo trabalhado - o unico dos quatro puramente retorico; os outros tres tem
        funcao estrutural (introduzir as lacunas, ser erro comum, fechar o recap) e LC-07 obriga os
        dois ultimos. AZUL 2 (parte) - "modelo idealizado" estava definido no vocabulario, aparecia
        no recap e sumira do corpo, onde a lacuna 2 dizia "o modelo geometrico"; alinhado, sem custo
        de palavras.'
    progressao: 'LIMPA depois desta revisao; tinha UM vazamento antes dela. A cadeia a01 (o
      principio) -> a02 (os valores) -> a03 (os efeitos que os valores servem) -> a04 (o que eles
      custam em peso) -> a05 (o que eles custam em cor) -> a06 (o que a ferramenta calcula e o que
      nao calcula) e estritamente crescente; cada aula declara o que a anterior entregou e NENHUMA
      usa resultado de aula posterior - todas as remissoes para frente sao negativas, no bloco "O que
      nao concluir", verificadas uma a uma. O vazamento era o laranja 1 (a a01 anunciava a a02 pela
      tese refutada); corrigido, a passagem a01->a02 ficou MAIS FORTE do que antes da auditoria,
      porque a a01 agora entrega a a02 exatamente a PERGUNTA que a a02 responde em vez de uma
      resposta errada. Duas amarracoes criadas pela auditoria e confirmadas aqui como as melhores do
      modulo: a01->a02, o mecanismo da extincao (luz perdida na SEGUNDA faceta) deixou de ser detalhe
      da a01 e virou o TETO que explica toda a tabela da a02 - a mesma proposicao sustentando duas
      conclusoes em niveis diferentes; e a04->a05, a mesma variavel fisica resolvendo dois problemas
      distintos, com as duas aulas avisando explicitamente, cada uma de seu lado, que nao sao o mesmo
      compromisso. Pre-requisito externo do curso-gemologia citado POR NOME em a01, a02 e a05, nunca
      por wikilink.'
    carga_por_aula: 'Nenhuma aula precisa ser dividida. Tres a quatro conceitos novos independentes
      por aula. A a04 e a de maior carga (rendimento, corte de precisao, corte nativo mais a
      controversia, culaca, meetpoint, contorno, geometria da elipse, assimetria do erro), mas
      SUSTENTA pelo mesmo criterio aceito na a04 do modulo 07: e UM criterio (o compromisso)
      instanciado em TRES lugares que sao as tres respostas possiveis, mais uma oposicao terminologica
      que nomeia o eixo inteiro - conceitos CONTRASTIVOS sob um organizador unico, nao somativos. O
      amarelo 6 melhorou justamente a legibilidade dessa estrutura.'
    cobertura_objetivos: 'Um objetivo por aula, seis objetivos, seis aulas, todos cobertos por
      Conteudo E exemplo E recap, e todos NO NIVEL COGNITIVO DECLARADO. NENHUMA celula vazia e NENHUM
      conteudo orfao. Os seis verbos sao de conhecimento observavel - aplicar, ler/explicar,
      distinguir, explicar/identificar, relacionar, descrever/delimitar; nenhum
      "entender/conhecer/saber" e NENHUM verbo de execucao. Os tres exemplos de nivel ANALISAR (a03,
      a04, a05) exercem de fato a analise: cada um compara DUAS alternativas sobre um material ou
      bruto fixo, isolando a decisao de projeto como unica variavel. RESSALVA DE FORMA, NAO DE
      COBERTURA: o enunciado de oa02 ("ler uma tabela de angulos-alvo POR FAIXA de indice de
      refracao") descreve a aula pela organizacao que ela ensina a relativizar; a cobertura e
      integral (a aula ensina a ler a tabela, explica a base fisica e declara os limites - as tres
