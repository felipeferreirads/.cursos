    achados_principais: 'VERMELHO 1 (a02, MAQ-RAIO-ALVO-001 + MAQ-COPO-CASADO-001) - o diametro
      final da esfera era dado como fixado pela maquina ("o raio-alvo e fixado pela abertura entre
      os copos ... sem mudar mais o raio") e a calha do copo como tendo exatamente o raio-alvo. As
      fichas de fabricante dizem o contrario: os cabecotes sao de MOLA e avancam, a esfera encolhe
      continuamente, cada tamanho de copo cobre uma FAIXA de diametros (copo de 25 mm produz
      esferas de 25 a 35,5 mm) e quem determina o diametro e o operador, medindo com paquimetro e
      parando. Ancorava a aula 04 no lugar errado: se o copo fixasse o raio, o copiador de perfil
      da a04 nao precisaria existir. VERMELHO 2 (a02, MAQ-EIXO-CIL-001) - "um eixo so produz um
      cilindro, com perfil reto ao longo do eixo" e falso e CONTRADIZ a propria aula 04, onde um
      eixo unico mais copiador de perfil produz um ovo. Argumento refeito sobre os POLOS: os dois
      pontos onde o eixo fura a superficie ficam parados e nunca sao varridos; todo solido de
      revolucao tem dois polos e a esfera e a forma que nao admite polo privilegiado. VERMELHO 3
      (a03, DEF-BAND-ORIENT-001) - "a agata tem dureza uniforme banda a banda, logo o undercut nao
      se aplica" e falso (o socavamento entre bandas de agata e problema corrente de oficina) e
      contradizia o PROPRIO TITULO e o PROPRIO VOCABULARIO da aula, que trazem "banda dura / banda
      mole" exemplificando com agata. Pior: fazia a aula separar os dois defeitos PELO MATERIAL
      quando o criterio correto e PELO RELEVO. Secao refeita em dois defeitos com o mesmo nome, e
      a secao de diagnostico retitulada "O criterio de diagnostico e o relevo, nao o material".
      VERMELHO 4 (a04, TOR-DEF-REVOL-001) - o criterio "toda secao perpendicular ao eixo e um
      circulo" era dado como definicao de forma torneada e imediatamente contrariado pelos dois
      exemplos que a propria aula admitia: obelisco (secao quadrada ou hexagonal, as vezes
      canelado) e briolette (por definicao facetada e sem cinta). Instalada a distincao aninhada
      solido de revolucao ESTRITO (simetria continua) versus forma de EIXO UNICO (simetria
      continua OU ciclica), com a formula "estrito subconjunto de eixo unico" e um teste de duas
      perguntas em ordem. AZUL 1 (a01, ESF-TOL-FAIXA-001) - a tolerancia de esfericidade em
      centesimos de milimetro e o "gabarito de anel calibrado" nao se confirmaram em fonte
      lapidaria nenhuma (o material de ring gauge que existe e de metrologia industrial); a
      afirmacao foi REMOVIDA, nao reescrita com numero novo, e no lugar entrou o metodo
      documentado (paquimetro em varias direcoes, maior menos menor). BRANCO 1 (a03,
      DEF-BAND-DUREZA-001) - por que uma banda de agata socava mais que a vizinha e questao em
      aberto no oficio (dureza entre fases de silica x porosidade e tomada de polimento);
      declarada sem arbitrar, instalando o UNICO LC-08 do modulo, que entrou com zero.'
    forwarded_to_didactic_review:
    - 'AS QUATRO AULAS FORAM ENXUGADAS PARA CABER NO TETO - verificar corte a corte se algum
      removeu CONTEUDO em vez de repeticao. VERIFICADO na revisao didatica de 2026-09-04 (azul 1):
      os treze cortes foram reconferidos um a um contra a versao pre-auditoria e NENHUM removeu
