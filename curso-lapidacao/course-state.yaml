      por corte discreto) sobrevive transformada e mais informativa: a aula agora diz ONDE o corte
      discreto para (a preforma) e o que assume dali em diante (a abrasao continua).'
    - 'a04 - CARGA DE CONCEITOS: dois criterios aninhados, um teste de duas perguntas, tres
      formas, duas tradicoes de proporcao do obelisco. AVALIADO na revisao didatica: SUSTENTA, e a
      aula foi MANTIDA. A estrutura efetiva e um criterio de dois niveis + um procedimento que o
      aplica + tres instancias que sao as tres respostas possiveis do procedimento, mais a gota x
      briolette como quarto caso de teste. Conceitos CONTRASTIVOS instanciando um gabarito unico,
      nao somativos - mesmo padrao aceito na a05 do modulo 06 - e aqui com um algoritmo explicito
      que o exemplo trabalhado executa nas tres pecas na mesma ordem.'
    - 'a02 - O EXEMPLO TRABALHADO FICOU PARALELO AO CONTEUDO; julgar se e exemplo ou resumo.
      AVALIADO na revisao didatica (amarelo 4): e exemplo, com acao PARCIAL. Instancia com numeros
      concretos que o Conteudo nao tem, carrega o teto geometrico que so existe nele, e e a unica
      passagem em que os tres arranjos de maquina sao comparados NA MESMA PECA - o contraste que
      oa02 pede ao dizer "justificar". O que a auditoria pegou de real e que ele nao forca uma
      DECISAO, o que e limitacao legitima numa aula de nivel "explicar". Nenhuma reestruturacao (a
      folga era de 10 palavras e o financiamento teria de sair do mecanismo recem-instalado);
      encaminhado ao gerador-de-questionarios.'
    - 'LC-08 - o modulo entrou com ZERO controversias e a auditoria instalou uma (a03, a causa do
      socavamento entre bandas). AVALIADO na revisao didatica (azul 3): UMA BASTA. Ela e genuina,
      central (esta no coracao de oa03, nao numa margem) e ensina uma distincao epistemologica
      util - duas hipoteses podem prever o mesmo observavel sem serem a mesma coisa. A candidata
      sugerida para uma segunda (quantas faces tirar na serra antes da maquina) foi DESCARTADA: e
      decisao de eficiencia de oficina, nao divergencia sobre um fato, e num curso teorico seria
      encenacao em terreno de bancada. Mesmo criterio do modulo 06.'
    - 'a03 - O CALLOUT "[!question]" E O PRIMEIRO DO MODULO; conferir consistencia com os modulos
      anteriores. RESOLVIDO na revisao didatica (amarelo 1): o curso NAO usa callout para
      controversia declarada - usa prosa, com abertura padronizada ("Controversia em aberto:",
      "Fica em aberto:", "Pergunta em aberto:", "Ponto em aberto:"). Os unicos callouts do curso
      sao pedidos de ilustracao. Manter o callout criaria um segundo dispositivo visual para a
      mesma funcao e colidiria com o que este mesmo modulo passou a usar para a ilustracao da a01.
      Convertido para prosa com "Pergunta em aberto:".'
    - 'VOCABULARIO REINDEXADO EM TRES DAS QUATRO AULAS; conferir LC-01 nas entradas novas.
      VERIFICADO na revisao didatica: um achado (amarelo 2) - o corpo da a01 e da a02 usava
      "preforma de serra" enquanto a tabela definia "preforma de esfera"; dois nomes para a mesma
      coisa, na aula que introduz o conceito. Alinhados, com "feita na serra" como aposto. Os
      demais termos novos (polo, coroa de contato, diametro-alvo, faixa de trabalho do copo,
      bandeamento fora de centro, solido de revolucao estrito, forma de eixo unico, briolette) sao
      todos definidos no corpo na primeira aparicao.'
