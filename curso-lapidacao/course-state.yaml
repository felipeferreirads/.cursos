decisions:
- date: '2026-09-01'
  decision: 'Criar a teoria da lapidação como curso INDEPENDENTE, e não como módulo do curso-gemologia. Justificativa:
    o assunto tem bibliografia própria (Sinkankas, Vargas, Wykoff, USFG), sequência de ensino própria e sete famílias
    de técnica; embutido na gemologia ele viraria uma aula e perderia a estrutura. O curso-gemologia continua com
    sua aula de anatomia e talhe (módulo 01) e sua aula de lapidação do diamante (módulo 02) — este curso não as
    substitui, aprofunda o que elas resumem.'
- date: '2026-09-01'
  decision: Nível de chegada é avançado/especialista TEÓRICO. Nenhuma aula, questão ou flashcard pode afirmar
    competência de bancada ou destreza manual. O exame escrito avalia princípio, escopo, geometria, causa-efeito
    e limite — nunca "saber fazer". Regra herdada do curso-gemologia e válida para toda skill a jusante.
- date: '2026-09-01'
  decision: O pré-requisito de gemologia é CROSS-CURSO e referido POR NOME, nunca por wikilink. Um wikilink para
    fora do curso quebra no Obsidian e o validador estrutural o reporta como link morto. Mesma regra do curso-gemologia.
- date: '2026-09-01'
  decision: 'Facetamento cobre projeto óptico e leitura/execução de diagramas: ângulo crítico, ângulos-alvo por
    faixa de índice de refração, meetpoint faceting, índice, mastro, cheater, tangent ratio e o compromisso brilho
    × rendimento. NÃO cobre autoria de designs novos nem otimização em software; GemCad e GemRay entram apenas
    como consciência de ferramenta (o que existe, o que faz), no módulo 08, aula 06.'
- date: '2026-09-01'
  decision: 'Tratamentos entram como módulo-fronteira ENXUTO (módulo 13, 5 aulas), cobrindo só o que acontece
    na oficina de lapidação: pedras montadas, estabilização e impregnação, tingimento, calor de processo, oleamento
    e enceramento, mais a regra de divulgação. Aquecimento clássico de rubi e safira, irradiação, difusão reticular,
    preenchimento de fratura com vidro ou resina e HPHT ficam no curso-gemologia (módulos 02 e 03) e entram aqui
    apenas como referência cruzada POR NOME.'
- date: '2026-09-01'
  decision: 'Ordem escolhida: física do desbaste (02) e equipamento (03, 04) ANTES das técnicas de talhe. A ordem
    alternativa — cabochão primeiro, como "o mais simples", com o equipamento explicado no caminho — foi rejeitada
    porque obrigaria a reensinar máquina, lap, abrasivo e dop dentro de cada módulo de técnica, e o módulo de
    equipamento pedido pelo usuário viraria redundante.'
- date: '2026-09-01'
  decision: 'Equipamento dividido em DOIS módulos por coesão, não por tamanho: 03 é a máquina (serra, esmeril,
    facetadora, tambor) e 04 é a interface com a pedra (lap, abrasivo, polidor, dop). O módulo 02 fica com o
    MECANISMO da abrasão e do polimento; o 04 fica com o INVENTÁRIO e as regras de casamento material-abrasivo.
    Sem essa separação os dois se sobrepõem.'
- date: '2026-09-01'
  decision: 'claim_id deste curso usa o formato de 4 segmentos ^[A-Z]{2,4}-[A-Z0-9]+-[A-Z0-9]+-[0-9]{3}$ desde
    a primeira aula. O curso-gemologia está preso a 3 segmentos por herança e o erro não é repetido aqui.'
- date: '2026-09-02'
  decision: 'VOLUME: manter 14 módulos / 75 aulas. Rejeitada a proposta de enxugar para ~12/~68 fundindo 03+04
    (máquinas + laps/abrasivos/dop) e 06+07 (cabochão + esfera/torneadas). Justificativa do usuário: a divisão
    03/04 por coesão (máquina × interface com a pedra) e 06/07 (cúpula única × sólido de revolução) já foi
    decidida em 2026-09-01 e o módulo 02 foi escrito sob essa premissa; a fusão obrigaria a refazer hubs e
    grafo de pré-requisitos sem ganho didático claro.'
- date: '2026-09-02'
  decision: 'INTARSIA: não incluir módulo dedicado de intarsia / mosaico / pietra dura / embutido entre os
    módulos 11 e 12. O curso permanece com 14 módulos. Se couber, intarsia entra no máximo como menção de
    escopo dentro do módulo 11 (escultura, gravação e contas), não como conteúdo próprio.'
- date: '2026-09-02'
  decision: 'REGUA DE palavras_corpo (LC-02) fixada e registrada em _contexto.md: conta-se de "## Conteúdo"
    até o fim de "## Recap relâmpago" inclusive (conteúdo + exemplo trabalhado + Erros comuns + O que não
    concluir + Recap relâmpago); NÃO conta vocabulário, "Antes de começar", "Ao final você vai conseguir",
    "Próxima aula", "Fontes consultadas" nem o rodapé YAML; contagem por len(texto.split()). Vale do módulo
    03 em diante. Os rodapés do módulo 01 (declarados ~200 palavras abaixo desta régua) ficam como estão —
    a folga do "~" cobre — e só serão realinhados se o módulo 01 for reaberto por outro motivo. Encerra a
    pendência de convenção aberta na revisão didática do módulo 02.'
- date: '2026-09-02'
  decision: 'DIVIDA TECNICA (spin-off): course-state.schema.json e audit.schema.json do plugin FFS-PluginStudy
    estão desatualizados — rejeitam campos que as próprias skills auditor-cientifico / revisor-didatico /
    reconciliação gravam (mode, findings, corrected, decision_lc02, verified_ok, etc.). Nenhum curso do vault
    (lapidação, gemologia, geologia) valida limpo hoje. Decisão do usuário: tratar num trabalho separado que
    atualiza o schema para aceitar o que é produzido, sem enxugar o estado dos cursos. NÃO bloqueia o módulo
    03. O módulo 02 fica tão conforme quanto o módulo 01.'
- date: '2026-09-04'
  decision: 'FLASHCARDS: não gerar baralho de flashcards para este curso a partir do módulo 06. Decisão
    do usuário ("não precisa de flashcard para o curso de lapidação, pule os próximos flashcards"). O
    módulo 05 mantém o baralho de 81 cards já gerado; módulos 06 em diante recebem status skipped no
    bloco flashcards. O pipeline de qualidade dos módulos 06+ passa a ser: aulas → auditoria científica
    → correção → revisão didática → questionário(s). O gate (nenhuma avaliação com 🔴/🟠 aberto) continua
    valendo. _contexto.md e o pipeline dos hubs dos módulos futuros devem refletir a ausência da etapa.'
