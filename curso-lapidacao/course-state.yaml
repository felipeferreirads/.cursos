      arquivos DEPOIS das correcoes. Nenhuma duplicata interna e NENHUMA colisao com os claim_id dos
      modulos 01-07. RAY-EX-SAFIRA-001 e RAY-FONTE-USFG-001 foram criados pela auditoria como
      rotulos de ACHADO, nao de alegacao auditavel, e por decisao consciente NAO viraram claim_id no
