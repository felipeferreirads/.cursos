    regua_palavras_corpo: 'A mesma de _contexto.md: de "## Conteudo" ao fim de "## Recap relampago"
      inclusive, len(texto.split()). A contagem reproduziu EXATAMENTE os seis valores declarados
      antes da correcao (1589/1566/1597/1615/1612/1624), o que revalida a regua pela sexta vez. As
      seis aulas entraram e sairam SOB o teto de ~1600: cada acrescimo foi financiado por corte de
      redundancia da propria aula, o metodo dos modulos 04 a 07. Rodapes ressincronizados nas seis.'
    bench_competence_scan: 'NENHUM achado. O texto acrescentado por esta correcao descreve
      geometria, mecanismo optico, valor publicado com fonte, nomenclatura e declaracao de
      controversia - nunca operacao de maquina nem destreza manual. A a06 continua declarando ray
      tracing como fora do escopo operacional em "O que nao concluir".'
    priority_points_note: 'Os tres pontos de atencao prioritaria sinalizados pelo redator tiveram
      desfechos diferentes. (1) TABELA DE ANGULOS-ALVO (a02) - CONFIRMADA como problema grave:
      os valores publicados sao praticamente PLANOS em 40-43 graus para toda a gama de gema comum
      (IGS: quartzo 42, berilo 43, corindon 42, zircao 41), nao decrescentes com o indice; o erro
      individual mais grave e o corindon, 38-40 na aula contra 42 publicado; e a USFG nao publica
      essa tabela - diz textualmente "There simply is no magic bullet or universal set of angles"
      -, logo a atribuicao de fonte tambem e falsa. A excecao do diamante tem VALOR correto
      (40,75, Tolkowsky) mas CAUSA invertida: Tolkowsky registra que a dispersao IMPEDE o angulo
      de subir mais, nao que o levante acima do critico. (2) REGRA PROFUNDIDADE x SATURACAO (a05)
      - NAO E PROBLEMA: direcao e fisica corretas, confirmadas textualmente pela USFG ("If you
      have dark rough ... keeping the stone shallow ... Use lower crown and/or pavilion angles"
      / "if you re cutting clear or pale colored material ... Employ higher crown and pavilion
      angles"). Aula 05 sai limpa, com um unico achado que e reflexo do vermelho da aula 06.
      (3) GEMCAD/GEMRAY (a06) - PROBLEMA, mas o oposto do temido: nada foi fabricado, os nomes e
      a autoria sao reais (Robert W. Strickland, gemcad.com, GemRay em codigo aberto desde 2023);
      o erro e a aula SUBESTIMAR o GemRay, negando-lhe capacidades de cor, de absorcao por
      caminho optico e de dispersao que ele documentadamente tem - e essa negacao e a espinha
      da aula 06 e foi repetida na aula 05.'
    claim_id_check: '35 alegacoes, TODAS casando com ^[A-Z]{2,4}-[A-Z0-9]+-[A-Z0-9]+-[0-9]{3}$
      (4 segmentos). Nenhuma com 5 - o escorregao dos modulos 04 e 05 nao voltou. NENHUMA colisao
      de prefixo: ANG-, TAB-, BRI-, COR-, RAY- e FAC-REN- cruzados por regex contra todos os
      claim_id dos modulos 01-07; ANG e TAB so aparecem antes como 2o/3o segmento (AJU-BATENTE-ANG-001,
      AJU-CHEATER-ANG-002, SEQ-TAB-MARCOS-001), nunca como prefixo, e FAC-REN- esta bem separado
      dos REN- do modulo 05 - a decisao deliberada do redator funcionou. Os 5 identificadores
      criados pela auditoria tambem foram verificados como livres. Divergencia registrada sem
      severidade: _contexto.md e _curso.md dao FAC-ANG-CRIT-001 como exemplar deste assunto e o
      redator usou ANG-; formato correto, sem colisao, assunto do validador-estrutural.'
    gate: 'LIBERADO. Nenhum achado vermelho ou laranja em aberto - os 12 foram corrigidos e os 4 de
      julgamento (2 azuis, 2 brancos) foram fechados com decisao registrada. O questionario deixou de
      estar bloqueado pela auditoria, MAS nao deve ser gerado ainda: o pipeline dos modulos 06+ poe a
      revisao didatica entre a correcao e a avaliacao. Ordem: aulas -> auditoria -> correcao
      (concluida) -> REVISAO DIDATICA -> questionario(s). Sem flashcards.'
    forwarded_to_didactic_review: 'A AULA 02 E A PRIORIDADE: tres dos quatro vermelhos estavam nela e
      a correcao de TAB-BASE-FISICA-001 mudou a LINHA ARGUMENTATIVA inteira da secao de base fisica,
      que agora sustenta um piso que desce contra um teto que nao desce, com o exemplo trabalhado
      CONFIRMANDO a tese em vez de refuta-la. Reavaliar a coerencia da aula inteira, nao so os trechos
      tocados - ela perdeu 23 palavras liquidas mas trocou boa parte do corpo. SEGUNDO: possivel
      desalinhamento entre titulo e conteudo na a02 - o titulo e o objetivo oa02 falam em tabela POR
      FAIXA de indice, enquanto a licao central passou a ser que os valores sao publicados POR
      MATERIAL e que a faixa so organiza a leitura; a entrada de vocabulario foi ajustada para dizer
      isso, mas titulo e objetivo nao foram tocados (objetivo de aprendizagem nao se altera por
      auditoria). TERCEIRO: LC-08 saiu de zero para DUAS declaracoes (a03 e a04), ambas em prosa, na
      convencao do modulo 07 - julgar se duas e o numero certo para um modulo de seis aulas. QUARTO:
      as seis aulas foram enxugadas para financiar as correcoes - conferir corte a corte se algum
      removeu CONTEUDO em vez de repeticao, com atencao a a06 (~283 palavras cortadas) e a a04 (perdeu
      ~60 liquidas depois de ganhar tres blocos novos). QUINTO: conferir TITULOS DE SECAO contra o
      corpo reescrito - e a terceira vez que este curso pega titulo desatualizado por auditoria
      (modulos 04, 06 e 07, sempre na a02); nesta correcao o titulo da secao de base fisica da a02 JA
      foi trocado por esse motivo, mas "A tabela - valores de referencia por faixa" merece segunda
      olhada, pela mesma razao do segundo item.'
  didactic_review:
