    summary: 'Revisao didatica review-and-fix rodada DEPOIS da auditoria (ordem correta: correcao factual antes da didatica). 10 achados: 0 vermelhos, 2 laranjas, 6 amarelos, 2 azuis; 8 corrigidos, 2 azuis em aberto NAO BLOQUEANTES. Achado estrutural da rodada, mesma assinatura dos modulos 12 e 13: SEIS DOS OITO achados acionaveis foram INTRODUZIDOS PELAS PROPRIAS CORRECOES DA AUDITORIA, nao preexistiam. Os dois laranjas sao o mesmo efeito colateral em dois niveis: a correcao JUL-EXT-DICOT-001 tornou o diagnostico da a03 ternario (execucao, material, PROJETO), e (1) a a04 continuava construida sobre a dicotomia binaria antiga - abria dizendo que o diagnostico separa execucao de material, e a palavra ''estilo'' nao aparecia uma vez sequer, de modo que o leitor com uma causa de projeto na mao so tinha duas gavetas e a saida natural (guardar em ''material'', porque persiste) era exatamente o erro que a a03 acabara de corrigir; corrigido carregando as tres origens desde a abertura, com o projeto colocado no MEIO da escala de custo do recorte (e geometria, logo alcancavel, mas so refazendo a pedra em outro talhe), mais paragrafo de fecho nos irrecortaveis, linha no Recap e ''Erros comuns'' trocando a dicotomia por ''sem saber a origem''; (2) ''causa de projeto'' virou uma das tres categorias diagnosticas da a03 - corpo, tabela, exemplo, erros comuns e recap - sem entrada de vocabulario, violando o LC-01 justo no tipo de termo que nao se infere do contexto (o leitor le ''projeto'' como ''planejamento'' e perde a oposicao a ''material''); corrigido com entrada nova. Os seis amarelos: ''defeito propagado'' declarado no vocabulario da a03 e nunca usado no arquivo (resolvido pela substituicao pela entrada de causa de projeto - mantem a tabela em 5 termos, faixa do LC-03; o termo segue definido e usado na a04, onde e o conceito de trabalho); meetline sem entrada na a02 depois de JUL-UNDERCUT-CONT-001 lhe dar o papel de resolver a ambiguidade de quatro vias de undercut (mesma correcao que a revisao do modulo 12 aplicou a sua a04); verbete de undercut da a02 dizendo ''mais de um sentido'' enquanto o corpo passara a enumerar quatro com precisao; a01 citando as aulas 04 e 05 do modulo 09 sob um wikilink unico apontando so para a 04, sendo a 05 justamente o pre-requisito de que a a03 mais depende; duracoes declaradas fora de ordem apos a recontagem (a01 anunciava ~27 min com 1581 palavras, menos que a a02 com 1577 e ~29 min) - realinhadas para 29-30 min nas quatro; e o bloco cobertura da a04 omitindo ''O que nao concluir'', secao que cobre metade do enunciado do oa04 e cuja omissao faria o gerador-de-questionarios subestimar a cobertura. A carga nominal da a02 (sete defeitos) foi avaliada e NAO tratada como sobrecarga: nenhum dos sete e novo, a aula declara isso na abertura e organiza tudo por criterio e por familia - ela ensina UMA ideia, o catalogo como grade de inspecao; registrado no relatorio para que uma revisao futura nao a ''conserte'' dividindo-a. A a03, declarada no hub como o ponto de maior dificuldade do curso, tambem foi avaliada e nao dividida: sustenta-se por reancorar num caso menor ja dominado (o meetpoint do modulo 09), mapear um defeito por paragrafo e fechar com tabela de sete linhas. Progressao do modulo conferida item a item e limpa: criterio -> nome -> causa -> decisao, cada aula respondendo a pergunta que a anterior deixou explicitamente em aberto e nenhuma usando resultado de aula posterior. Cobertura de objetivos completa: 4 de 4, um objetivo por aula, nenhum objetivo nem secao orfa, todos os verbos observaveis (enumerar, identificar, inferir, avaliar). Regras duras reverificadas apos as edicoes: nivel teorico sem competencia de bancada, gemologia so por nome, claim_id 20/20 em 4 segmentos, LC-01 a LC-08, palavras_corpo 1577-1600 dentro do teto ~1600. Alinhamento com avaliacao nao verificavel: o questionario do modulo 14 ainda nao existe; os pontos que ele precisa cobrir estao em traps_for_quiz_generator no manifesto