curriculum_basis: literatura de facetamento amador e de lapidação de referência — Sinkankas, Gem Cutting; A
  Lapidary's Manual (sequência serrar → desbastar → lixar → polir, e os capítulos de cabochão, facetado, esfera,
  conta, tambor, escultura e gravação) + Vargas & Vargas, Faceting for Amateurs + Wykoff, Beginner's Guide to
  Faceting e Techniques of Master Faceting + material técnico da United States Faceters Guild (ângulo crítico e
  índice de refração, meetpoint faceting, conversão de design pelo tangent ratio, dicionário de facetamento) +
  escola de artes lapidárias William Holland e a taxonomia de disciplinas das guildas norte-americanas + literatura
  do GIA sobre a tradição de Idar-Oberstein, sobre a evolução da escultura chinesa de jade e sobre pleocroísmo
  em gemas facetadas + Lapidary Journal e Rock & Gem para cabochão, freeform e facetamento côncavo + patente de
  facetamento côncavo-convexo de Douglas Hoffman (US 5.044.123) e a bibliografia do talhe de fantasia de Bernd
  Münsteiner + AGTA Gemstone Information Manual e a regra de divulgação da FTC para pedras montadas e material
  estabilizado
starting_level: conclusão do módulo 01 do curso de Gemologia (propriedades diagnósticas, óptica da gema, dureza,
  tenacidade, clivagem, sensibilidade térmica, pleocroísmo e fenômenos ópticos). Pré-requisito externo, referido
  por nome e nunca por wikilink.
target_level: avançado / especialista TEÓRICO. O curso não afirma nem avalia competência de bancada.
estimated_lessons: 75
estimated_hours: 31 h
learning_outcomes:
- Escolher a família de talhe e o projeto de corte adequados a um material, justificando a escolha pelas propriedades
  da gema e pela leitura do bruto.
- Explicar o desempenho óptico de um talhe facetado a partir do ângulo crítico, dos ângulos-alvo por faixa de
  índice de refração e dos compromissos entre brilho, cor e rendimento.
- Ler um diagrama de lapidação, extrair dele a sequência de corte e reescalá-lo para outro índice de refração
  pela conversão do tangent ratio.
- Explicar como cada família de talhe — cabochão, facetado, misto, esfera e formas torneadas, escultura e fancy
  cutting — é produzida e que problema cada uma resolve.
- Relacionar cada equipamento, lap, abrasivo, polidor e sistema de dop à operação que executa e ao defeito que
  sua escolha errada produz.
- Delimitar quais tratamentos pertencem à oficina de lapidação e formular a regra de divulgação correspondente.
- Julgar a qualidade de um talhe pronto pelos critérios de simetria, proporção, encontro de facetas e acabamento,
  e inferir do defeito visível a etapa do processo que o produziu.
